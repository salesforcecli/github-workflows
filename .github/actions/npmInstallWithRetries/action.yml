name: npm-install-with-retries
description: 'Wraps npm ci with retries and timeouts. New workflows should use setupNodeAndInstall for package-manager-agnostic installation.'
inputs:
  ignore-scripts:
    default: 'false'
    description: 'Skip pre/post install scripts'
runs:
  using: composite
  steps:
    - name: timeout config
      run: npm config set fetch-timeout 600000
      shell: bash
    - name: npm ci
      uses: salesforcecli/github-workflows/.github/actions/retry@main
      with:
        command: npm ci --no-audit --no-fund ${{ inputs.ignore-scripts == 'true' && '--ignore-scripts' || '' }}
