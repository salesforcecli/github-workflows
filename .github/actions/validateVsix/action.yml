name: 'Validate VSIX OPC Part URIs'
description: 'Reject VSIX zip entry paths that contain spaces or surrounding whitespace. Marketplace publish fails on those paths.'

inputs:
  dir:
    description: 'Directory to search for **/*.vsix'
    required: false
    default: './packages'

runs:
  using: composite
  steps:
    - name: Install validator dependencies
      shell: bash
      run: npm install jszip glob --prefix "$GITHUB_ACTION_PATH"
    - name: Validate VSIX OPC Part URIs
      shell: bash
      run: node "$GITHUB_ACTION_PATH/validate-vsix.mjs" "${{ inputs.dir }}"
