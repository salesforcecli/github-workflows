name: "Publish VSIX"
description: "Publishes VSIX files to a marketplace with dry-run support"

inputs:
  vsix-path:
    description: "Path to the VSIX file to publish"
    required: true
  publish-tool:
    description: "Publishing tool to use"
    required: true
  pre-release:
    description: "Publish as pre-release version"
    required: false
    default: "false"
  dry-run:
    description: "Run in dry-run mode"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        VSIX_PATH: ${{ inputs.vsix-path }}
        PUBLISH_TOOL: ${{ inputs.publish-tool }}
        PRE_RELEASE: ${{ inputs.pre-release }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        # Validate VSIX path exists
        if [ ! -f "$VSIX_PATH" ]; then
          echo "❌ Error: VSIX file not found at $VSIX_PATH"
          exit 1
        fi

        # Validate VSIX file extension
        if [[ ! "$VSIX_PATH" =~ \.vsix$ ]]; then
          echo "❌ Error: File must have .vsix extension"
          exit 1
        fi

        # Validate publish tool
        if [[ ! "$PUBLISH_TOOL" =~ ^(ovsx|vsce)$ ]]; then
          echo "❌ Error: Invalid publish tool: $PUBLISH_TOOL"
          exit 1
        fi

        for value in "$PRE_RELEASE" "$DRY_RUN"; do
          case "$value" in
            true|false) ;;
            *) echo "❌ Error: pre-release and dry-run must be true or false"; exit 1 ;;
          esac
        done

        echo "✅ Input validation passed"

    - name: Audit publish attempt
      shell: bash
      env:
        VSIX_PATH: ${{ inputs.vsix-path }}
        PUBLISH_TOOL: ${{ inputs.publish-tool }}
        PRE_RELEASE: ${{ inputs.pre-release }}
        DRY_RUN: ${{ inputs.dry-run }}
        ACTOR: ${{ github.actor }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW: ${{ github.workflow }}
      run: |
        # Create audit log entry
        AUDIT_LOG="/tmp/publish_audit.log"
        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

        # Get file info for audit
        FILE_SIZE=$(stat -c%s "$VSIX_PATH" 2>/dev/null || stat -f%z "$VSIX_PATH" 2>/dev/null || echo "unknown")
        FILE_HASH=$(sha256sum "$VSIX_PATH" 2>/dev/null | cut -d' ' -f1 || echo "unknown")

        # Log audit information
        echo "[$TIMESTAMP] PUBLISH_ATTEMPT: actor=$ACTOR, repo=$REPO, run_id=$RUN_ID, workflow=$WORKFLOW, tool=$PUBLISH_TOOL, file=$VSIX_PATH, size=$FILE_SIZE, hash=$FILE_HASH, pre_release=$PRE_RELEASE, dry_run=$DRY_RUN" >> "$AUDIT_LOG"

        # Also log to GitHub Actions output for visibility
        echo "🔍 AUDIT: Publish attempt logged - $TIMESTAMP"
        echo "  Actor: $ACTOR"
        echo "  Repository: $REPO"
        echo "  Run ID: $RUN_ID"
        echo "  Workflow: $WORKFLOW"
        echo "  Tool: $PUBLISH_TOOL"
        echo "  File: $VSIX_PATH"
        echo "  Size: $FILE_SIZE bytes"
        echo "  Hash: $FILE_HASH"
        echo "  Pre-release: $PRE_RELEASE"
        echo "  Dry-run: $DRY_RUN"

    - name: Publish VSIX
      id: publish
      shell: bash
      env:
        VSIX_PATH: ${{ inputs.vsix-path }}
        PUBLISH_TOOL: ${{ inputs.publish-tool }}
        PRE_RELEASE: ${{ inputs.pre-release }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        echo "Publishing $VSIX_PATH"

        # Calculate marketplace name based on publish tool
        if [ "$PUBLISH_TOOL" = "ovsx" ]; then
          MARKETPLACE_NAME="Open VSX Registry"
          TOKEN_ENV="OVSX_PAT"
        else
          MARKETPLACE_NAME="Visual Studio Marketplace"
          TOKEN_ENV="VSCE_PERSONAL_ACCESS_TOKEN"
        fi

        PRE_RELEASE_FLAG=""
        if [ "$PRE_RELEASE" = "true" ]; then
          PRE_RELEASE_FLAG="--pre-release"
          echo "Would publish as pre-release version"
        fi

        # Mask token in logs for security
        TOKEN_MASK="***"

        if [ "$DRY_RUN" = "true" ]; then
          echo "🔍 DRY RUN MODE - Would publish to $MARKETPLACE_NAME:"
          echo "  VSIX: $VSIX_PATH"
          echo "  Pre-release: $PRE_RELEASE"

          if [ "$PUBLISH_TOOL" = "ovsx" ]; then
            echo "  Command: npx ovsx publish \"$VSIX_PATH\" -p $TOKEN_MASK $PRE_RELEASE_FLAG"
          else
            echo "  Command: npx @vscode/vsce publish --packagePath \"$VSIX_PATH\" --skip-duplicate $PRE_RELEASE_FLAG"
          fi
          echo "✅ Dry run completed - no actual publish performed"
          echo "result=success" >> $GITHUB_OUTPUT
        else
          echo "Publishing VSIX: $VSIX_PATH"

          # Verify token is available
          if [ -z "${!TOKEN_ENV}" ]; then
            echo "❌ Error: $TOKEN_ENV environment variable is not set"
            echo "result=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

          publish_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              echo "Publish attempt ${attempt}/3"
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Publish failed; retrying in 15s..."
                sleep 15
              fi
            done
            return 1
          }

          if [ "$PUBLISH_TOOL" = "vsce" ]; then
            export VSCE_PAT="${!TOKEN_ENV}"  # ensure the expected env var is set
            publish_with_retry npx @vscode/vsce publish --packagePath "$VSIX_PATH" --skip-duplicate $PRE_RELEASE_FLAG
          else
            publish_with_retry npx ovsx publish "$VSIX_PATH" -p "${!TOKEN_ENV}" --skip-duplicate $PRE_RELEASE_FLAG
          fi

          PUBLISH_EXIT_CODE=$?
          if [ $PUBLISH_EXIT_CODE -eq 0 ]; then
            echo "✅ Successfully published to $MARKETPLACE_NAME"
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Failed to publish to $MARKETPLACE_NAME"
            echo "result=failure" >> $GITHUB_OUTPUT
            exit $PUBLISH_EXIT_CODE
          fi
        fi

    - name: Audit publish result
      shell: bash
      if: always() && inputs.dry-run != 'true'
      env:
        VSIX_PATH: ${{ inputs.vsix-path }}
        PUBLISH_TOOL: ${{ inputs.publish-tool }}
        ACTOR: ${{ github.actor }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        PUBLISH_RESULT: ${{ steps.publish.outputs.result }}
      run: |
        # Log the result of the publish attempt
        AUDIT_LOG="/tmp/publish_audit.log"
        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

        if [ "$PUBLISH_RESULT" = "success" ]; then
          echo "[$TIMESTAMP] PUBLISH_SUCCESS: actor=$ACTOR, repo=$REPO, run_id=$RUN_ID, tool=$PUBLISH_TOOL, file=$VSIX_PATH" >> "$AUDIT_LOG"
          echo "✅ AUDIT: Publish successful - $TIMESTAMP"
        else
          echo "[$TIMESTAMP] PUBLISH_FAILURE: actor=$ACTOR, repo=$REPO, run_id=$RUN_ID, tool=$PUBLISH_TOOL, file=$VSIX_PATH" >> "$AUDIT_LOG"
          echo "❌ AUDIT: Publish failed - $TIMESTAMP"
        fi
