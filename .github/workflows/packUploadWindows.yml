on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
        description: version for upload. do not include the 'v'
      channel:
        type: string
        required: true
        description: channel that the uploaded tarballs get promoted to
      nodeVersion:
        type: string
        default: lts/*
        description: node version to use for the tarball build
      package-manager:
        type: string
        required: false
        default: yarn
        description: "Package manager to use: npm, pnpm, or yarn"
      package-manager-version:
        type: string
        required: false
        default: "10"
        description: pnpm version to install when package-manager is pnpm
      cache-dependency-path:
        type: string
        required: false
        default: yarn.lock
        description: Path to the package manager lockfile
      install-command:
        type: string
        required: false
        default: yarn install --network-timeout 600000
        description: Command used to install repository dependencies
      pack-command:
        type: string
        required: false
        default: yarn pack:win
        description: Command used to pack the Windows installer
      upload-command:
        type: string
        required: false
        default: yarn upload:win
        description: Command used to upload the Windows installer
      promote-command:
        type: string
        required: false
        default: yarn channel:promote --cli sf --version "$INPUTS_VERSION" --target "$INPUTS_CHANNEL" --platform win
        description: Command used to promote the Windows installer

jobs:
  win:
    runs-on: ubuntu-latest
    env:
      SF_DISABLE_TELEMETRY: true
    steps:
      - uses: actions/checkout@v4

      - uses: salesforcecli/github-workflows/.github/actions/setupNodeAndInstall@main
        with:
          node-version: ${{ inputs.nodeVersion }}
          package-manager: ${{ inputs.package-manager }}
          package-manager-version: ${{ inputs.package-manager-version }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          install-command: ${{ inputs.install-command }}

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e05416b42376bcda221f9102c4f595f4994016be

      # TODO: It would be nice if we chould ditch homebrew for this install
      - run: brew install makensis

      - name: Pack for Windows
        env:
          PACK_COMMAND: ${{ inputs.pack-command }}
        run: bash -c "$PACK_COMMAND"

      - name: Upload Windows
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          UPLOAD_COMMAND: ${{ inputs.upload-command }}
        run: bash -c "$UPLOAD_COMMAND"

      - name: Promote win to ${{ inputs.channel }} channel
        env:
          INPUTS_VERSION: ${{ inputs.version }}
          INPUTS_CHANNEL: ${{ inputs.channel }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PROMOTE_COMMAND: ${{ inputs.promote-command }}
        run: bash -c "$PROMOTE_COMMAND"

      - name: Upload artifacts to Github release
        run: gh release upload "$INPUTS_VERSION" ./dist/win32/sf-*.exe --clobber --repo "$GITHUB_REPOSITORY"
        env:
          INPUTS_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.SVC_CLI_BOT_GITHUB_TOKEN }}
