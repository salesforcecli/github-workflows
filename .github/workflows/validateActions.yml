name: Validate actions

on: pull_request

permissions:
  contents: read

jobs:
  validate-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:actions
      - run: npm run test:actions
