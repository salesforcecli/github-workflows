on:
  workflow_call:
    secrets:
      SVC_CLI_BOT_GITHUB_TOKEN:
        description: A Github PAT with repo write access.
        required: true
    inputs:
      package-manager:
        type: string
        required: false
        default: yarn
        description: "Package manager to use: npm, pnpm, or yarn"
      package-manager-version:
        type: string
        required: false
        default: "10"
        description: pnpm version to install when package-manager is pnpm
      cache-dependency-path:
        type: string
        required: false
        default: yarn.lock
        description: Path to the package manager lockfile
      install-command:
        type: string
        required: false
        default: yarn install --network-timeout 600000
        description: Command used to install repository dependencies
      docs-command:
        type: string
        required: false
        default: yarn docs
        description: Command used to generate documentation
      nodeVersion:
        type: string
        required: false
        default: lts/*
        description: Node.js version to use

jobs:
  publish:
    runs-on: "ubuntu-latest"
    env:
      GITHUB_TOKEN: ${{ secrets.SVC_CLI_BOT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SVC_CLI_BOT_GITHUB_TOKEN }}

      - uses: salesforcecli/github-workflows/.github/actions/setupNodeAndInstall@main
        with:
          node-version: ${{ inputs.nodeVersion }}
          package-manager: ${{ inputs.package-manager }}
          package-manager-version: ${{ inputs.package-manager-version }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          install-command: ${{ inputs.install-command }}

      - name: Get Github user info
        id: github-user-info
        uses: salesforcecli/github-workflows/.github/actions/getGithubUserInfo@main
        with:
          SVC_CLI_BOT_GITHUB_TOKEN: ${{ secrets.SVC_CLI_BOT_GITHUB_TOKEN }}

      - uses: salesforcecli/github-workflows/.github/actions/gitConfig@main
        with:
          username: ${{ steps.github-user-info.outputs.username }}
          email: ${{ steps.github-user-info.outputs.email }}

      - name: Build docs
        env:
          DOCS_COMMAND: ${{ inputs.docs-command }}
        run: |
          rm -rf docs
          git worktree prune
          git fetch origin gh-pages:gh-pages
          git worktree add docs gh-pages
          bash -c "$DOCS_COMMAND"

      - name: Send to git
        run: |
          cd docs
          git add .
          git diff --cached --quiet || git commit -m 'docs: publishing gh-pages [skip ci]' --no-verify
          git push origin gh-pages --no-verify
