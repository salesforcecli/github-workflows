name: CI

# Reusable CI workflow template for VS Code extension repositories
#
# Usage from consuming repository:
#   jobs:
#     ci:
#       uses: salesforcecli/github-workflows/.github/workflows/vscode/ci-template.yml@main
#       with:
#         package-manager: npm
#         install-command: npm ci
#         lint-command: npm run lint
#         build-command: npm run build
#         test-command: npm run test
#         coverage-command: npm run test:coverage
#
# Features:
#   - Tests across multiple OS (Ubuntu, Windows)
#   - Tests across Node.js versions (lts/-1, lts/*, current)
#   - Coverage collection and reporting
#   - Parallel test execution
#   - Artifact upload for coverage reports

on:
  workflow_call:
    inputs:
      package-manager:
        description: "Package manager to use: npm, pnpm, or yarn"
        required: false
        default: "npm"
        type: string
      package-manager-version:
        description: "pnpm version to use when package-manager is pnpm"
        required: false
        default: "10"
        type: string
      cache-dependency-path:
        description: "Path to the package manager lockfile"
        required: false
        default: "package-lock.json"
        type: string
      install-command:
        description: "Command to install dependencies"
        required: false
        default: "npm ci"
        type: string
      lint-command:
        description: "Command to run linting"
        required: false
        default: "npm run lint"
        type: string
      compile-command:
        description: "Deprecated compatibility command used when build-command is empty"
        required: false
        default: ""
        type: string
      build-command:
        description: "Command to build or compile the project; leave empty to use compile-command"
        required: false
        default: "npm run compile"
        type: string
      test-command:
        description: "Command to run tests (without coverage)"
        required: false
        default: "npm run test"
        type: string
      test-coverage-command:
        description: "Deprecated compatibility command used when coverage-command is empty"
        required: false
        default: ""
        type: string
      coverage-command:
        description: "Command to run tests with coverage; leave empty to use test-coverage-command"
        required: false
        default: "npm run test:coverage"
        type: string
      coverage-report-command:
        description: "Command to merge coverage reports; set empty to skip"
        required: false
        default: "npm run test:coverage:report"
        type: string
      quality-command:
        description: "Command to run additional quality checks; set empty to skip"
        required: false
        default: "npm run test:quality"
        type: string
      extensions-root:
        description: "Root directory containing VS Code extensions"
        required: false
        default: "packages"
        type: string
      package-command:
        description: "Command to create stable VSIX artifacts"
        required: false
        default: "npm run package:packages"
        type: string
      prerelease-package-command:
        description: "Command to create prerelease VSIX artifacts"
        required: false
        default: "npm run package:packages:prerelease"
        type: string
      artifact-glob:
        description: "Glob for VSIX artifacts relative to the repository root"
        required: false
        default: "packages/**/*.vsix"
        type: string
  workflow_dispatch:
    inputs:
      package-manager:
        description: "Package manager to use: npm, pnpm, or yarn"
        required: false
        default: "npm"
        type: string
      package-manager-version:
        description: "pnpm version to use when package-manager is pnpm"
        required: false
        default: "10"
        type: string
      cache-dependency-path:
        description: "Path to the package manager lockfile"
        required: false
        default: "package-lock.json"
        type: string
      install-command:
        description: "Command to install dependencies"
        required: false
        default: "npm ci"
        type: string
      lint-command:
        description: "Command to run linting"
        required: false
        default: "npm run lint"
        type: string
      compile-command:
        description: "Deprecated compatibility command used when build-command is empty"
        required: false
        default: ""
        type: string
      build-command:
        description: "Command to build or compile the project; leave empty to use compile-command"
        required: false
        default: "npm run compile"
        type: string
      test-command:
        description: "Command to run tests without coverage"
        required: false
        default: "npm run test"
        type: string
      test-coverage-command:
        description: "Deprecated compatibility command used when coverage-command is empty"
        required: false
        default: ""
        type: string
      coverage-command:
        description: "Command to run tests with coverage; leave empty to use test-coverage-command"
        required: false
        default: "npm run test:coverage"
        type: string
      coverage-report-command:
        description: "Command to merge coverage reports; set empty to skip"
        required: false
        default: "npm run test:coverage:report"
        type: string
      quality-command:
        description: "Command to run additional quality checks; set empty to skip"
        required: false
        default: "npm run test:quality"
        type: string
      extensions-root:
        description: "Root directory containing VS Code extensions"
        required: false
        default: "packages"
        type: string
      package-command:
        description: "Command to create stable VSIX artifacts"
        required: false
        default: "npm run package:packages"
        type: string
      prerelease-package-command:
        description: "Command to create prerelease VSIX artifacts"
        required: false
        default: "npm run package:packages:prerelease"
        type: string
      artifact-glob:
        description: "Glob for VSIX artifacts relative to the repository root"
        required: false
        default: "packages/**/*.vsix"
        type: string

# Add explicit permissions for security
permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["lts/-1", "lts/*", "current"]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: false

      - name: Setup Node.js and install dependencies
        uses: salesforcecli/github-workflows/.github/actions/setupNodeAndInstall@ph/W-23773464-enable-pnpm-workflows
        with:
          node-version: ${{ matrix.node-version }}
          package-manager: ${{ inputs.package-manager }}
          package-manager-version: ${{ inputs.package-manager-version }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          install-command: ${{ inputs.install-command }}

      - name: Run linting
        env:
          LINT_COMMAND: ${{ inputs.lint-command }}
        run: bash -c "$LINT_COMMAND"

      - name: Build project
        env:
          BUILD_COMMAND: ${{ inputs.build-command || inputs.compile-command }}
        run: |
          if [ -z "$BUILD_COMMAND" ]; then
            echo "Error: build-command and compile-command cannot both be empty"
            exit 1
          fi
          bash -c "$BUILD_COMMAND"

      - name: Run tests with coverage (lts/current)
        if: ${{ matrix.node-version != 'lts/-1' && (inputs.coverage-command || inputs.test-coverage-command) != '' }}
        env:
          COVERAGE_COMMAND: ${{ inputs.coverage-command || inputs.test-coverage-command }}
        run: bash -c "$COVERAGE_COMMAND"

      - name: Run tests (lts/-1, no coverage)
        if: ${{ matrix.node-version == 'lts/-1' }}
        env:
          # Old-LTS defaults to ~4 GB old-space, which is too low for heavy stdlib suites.
          # Keep this scoped to lts/-1 and non-coverage runs only.
          NODE_OPTIONS: --max-old-space-size=6144
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -c "$TEST_COMMAND"

      - name: Merge coverage reports
        if: ${{ matrix.node-version != 'lts/-1' && inputs.coverage-report-command != '' }}
        env:
          COVERAGE_REPORT_COMMAND: ${{ inputs.coverage-report-command }}
        run: bash -c "$COVERAGE_REPORT_COMMAND"

      - name: Determine Node Label
        id: node-label
        shell: bash
        env:
          NODE_VERSION: ${{ matrix.node-version }}
        run: |
          if [ "$NODE_VERSION" = "lts/*" ]; then
            echo "value=lts" >> $GITHUB_OUTPUT
          elif [ "$NODE_VERSION" = "lts/-1" ]; then
            echo "value=lts-1" >> $GITHUB_OUTPUT
          elif [ "$NODE_VERSION" = "current" ]; then
            echo "value=current" >> $GITHUB_OUTPUT
          else
            echo "value=$NODE_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage report
        if: ${{ matrix.node-version != 'lts/-1' && (inputs.coverage-command || inputs.test-coverage-command) != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.os }}-${{ steps.node-label.outputs.value }}
          path: ./coverage

  test-quality:
    name: Test Quality
    needs: test
    if: inputs.quality-command != ''
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: ["lts/*"]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: false

      - name: Setup Node.js and install dependencies
        uses: salesforcecli/github-workflows/.github/actions/setupNodeAndInstall@ph/W-23773464-enable-pnpm-workflows
        with:
          node-version: ${{ matrix.node-version }}
          package-manager: ${{ inputs.package-manager }}
          package-manager-version: ${{ inputs.package-manager-version }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          install-command: ${{ inputs.install-command }}

      - name: Run quality tests
        env:
          QUALITY_COMMAND: ${{ inputs.quality-command }}
        run: bash -c "$QUALITY_COMMAND"

  package:
    name: Package
    needs: test
    if: ${{ needs.test.result == 'success' }}
    uses: salesforcecli/github-workflows/.github/workflows/vscode-package.yml@main
    with:
      branch: ${{ github.head_ref || github.ref_name }}
      artifact-name: vsix-packages
      dry-run: false
      extensions-root: ${{ inputs.extensions-root }}
      package-manager: ${{ inputs.package-manager }}
      package-manager-version: ${{ inputs.package-manager-version }}
      cache-dependency-path: ${{ inputs.cache-dependency-path }}
      install-command: ${{ inputs.install-command }}
      package-command: ${{ inputs.package-command }}
      prerelease-package-command: ${{ inputs.prerelease-package-command }}
      artifact-glob: ${{ inputs.artifact-glob }}

  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [test, package]
    if: always()
    steps:
      - name: Check all jobs result
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "Test job(s) failed"
            exit 1
          fi
          if [[ "$PACKAGE_RESULT" != "success" ]]; then
            echo "Package job failed"
            exit 1
          fi
          echo "All jobs succeeded"

  slack-notify:
    name: CI Failed Notification
    needs: [test, package]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push' && (needs.test.result == 'failure' || needs.package.result == 'failure')
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v3.0.3
        with:
          payload: |
            {
              "text": "❌ CI Pipeline Failed",
              "event": "CI workflow failed, run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "repo": "${{ github.repository }}",
              "test_result": "${{ needs.test.result }}",
              "package_result": "${{ needs.package.result }}",
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.IDEE_MAIN_SLACK_WEBHOOK }}
