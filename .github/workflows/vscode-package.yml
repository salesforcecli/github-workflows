name: Package

# Reusable workflow for packaging VS Code extensions into VSIX files
#
# Usage from consuming repository:
#   jobs:
#     package:
#       uses: salesforcecli/github-workflows/.github/workflows/vscode/package.yml@main
#       with:
#         branch: main
#         pre-release: true

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        default: "22.x"
        type: string
      branch:
        description: "Branch to package from"
        required: false
        default: "main"
        type: string
      artifact-name:
        description: "Name for the VSIX artifacts (base name or pre-calculated: vsix-packages-{run_number}-{mode})"
        required: false
        default: "vsix-packages"
        type: string
      dry-run:
        description: "Run in dry-run mode"
        required: false
        default: "false"
        type: string
      pre-release:
        description: "Indicates if this is a pre-release version"
        required: false
        default: "false"
        type: string
      extensions-root:
        description: "Root directory for extensions (default: packages)"
        required: false
        default: "packages"
        type: string
      package-manager:
        description: "Package manager to use: npm, pnpm, or yarn"
        required: false
        default: "npm"
        type: string
      package-manager-version:
        description: "pnpm version to use when package-manager is pnpm"
        required: false
        default: "10"
        type: string
      cache-dependency-path:
        description: "Path to the package manager lockfile"
        required: false
        default: "package-lock.json"
        type: string
      install-command:
        description: "Command used to install dependencies"
        required: false
        default: "npm ci"
        type: string
      package-command:
        description: "Command used to create VSIX artifacts"
        required: false
        default: "npm run package:packages"
        type: string
      prerelease-package-command:
        description: "Command used to create prerelease VSIX artifacts"
        required: false
        default: "npm run package:packages:prerelease"
        type: string
      web-package-command:
        description: "Optional command used to create a web-target VSIX artifact"
        required: false
        default: ""
        type: string
      web-prerelease-package-command:
        description: "Optional command used to create a prerelease web-target VSIX artifact"
        required: false
        default: ""
        type: string
      artifact-glob:
        description: "Glob for VSIX artifacts relative to the repository root"
        required: false
        default: "packages/**/*.vsix"
        type: string
    outputs:
      artifact-name:
        description: "The calculated artifact name"
        value: ${{ jobs.package.outputs.artifact-name }}
  workflow_dispatch:
    inputs:
      node-version:
        description: "Node.js version to use"
        required: false
        default: "22.x"
        type: string
      branch:
        description: "Branch to package from"
        required: false
        default: "main"
        type: string
      dry-run:
        description: "Run in dry-run mode"
        required: false
        default: "false"
        type: string
      pre-release:
        description: "Indicates if this is a pre-release version"
        required: false
        default: "false"
        type: string
      extensions-root:
        description: "Root directory for extensions (default: packages)"
        required: false
        default: "packages"
        type: string
      package-manager:
        description: "Package manager to use: npm, pnpm, or yarn"
        required: false
        default: "npm"
        type: string
      package-manager-version:
        description: "pnpm version to use when package-manager is pnpm"
        required: false
        default: "10"
        type: string
      cache-dependency-path:
        description: "Path to the package manager lockfile"
        required: false
        default: "package-lock.json"
        type: string
      install-command:
        description: "Command used to install dependencies"
        required: false
        default: "npm ci"
        type: string
      package-command:
        description: "Command used to create VSIX artifacts"
        required: false
        default: "npm run package:packages"
        type: string
      prerelease-package-command:
        description: "Command used to create prerelease VSIX artifacts"
        required: false
        default: "npm run package:packages:prerelease"
        type: string
      web-package-command:
        description: "Optional command used to create a web-target VSIX artifact"
        required: false
        default: ""
        type: string
      web-prerelease-package-command:
        description: "Optional command used to create a prerelease web-target VSIX artifact"
        required: false
        default: ""
        type: string
      artifact-glob:
        description: "Glob for VSIX artifacts relative to the repository root"
        required: false
        default: "packages/**/*.vsix"
        type: string

# Add explicit permissions for security
permissions:
  contents: read
  actions: read

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.calc-artifact-name.outputs.artifact-name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.head_ref || github.ref }}

      - name: Setup Node.js and install dependencies
        uses: salesforcecli/github-workflows/.github/actions/setupNodeAndInstall@ph/W-23773464-enable-pnpm-workflows
        with:
          node-version: ${{ inputs.node-version || '22.x' }}
          package-manager: ${{ inputs.package-manager }}
          package-manager-version: ${{ inputs.package-manager-version }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          install-command: ${{ inputs.install-command }}

      # Universal + web-target VSIXs are defined in packages/apex-lsp-vscode-extension (Wireit: package + package-web).
      - name: Package VSIX artifacts
        env:
          EXTENSIONS_ROOT: ${{ inputs.extensions-root || 'packages' }}
          PACKAGE_COMMAND: ${{ inputs.package-command }}
          PRERELEASE_PACKAGE_COMMAND: ${{ inputs.prerelease-package-command }}
          WEB_PACKAGE_COMMAND: ${{ inputs.web-package-command }}
          WEB_PRERELEASE_PACKAGE_COMMAND: ${{ inputs.web-prerelease-package-command }}
        run: |
          if [ "${{ inputs.pre-release }}" = "true" ]; then
            bash -c "$PRERELEASE_PACKAGE_COMMAND"
            if [ -n "$WEB_PRERELEASE_PACKAGE_COMMAND" ]; then
              bash -c "$WEB_PRERELEASE_PACKAGE_COMMAND"
            fi
          else
            bash -c "$PACKAGE_COMMAND"
            if [ -n "$WEB_PACKAGE_COMMAND" ]; then
              bash -c "$WEB_PACKAGE_COMMAND"
            fi
          fi

      - name: Generate MD5 checksums
        id: md5-checksums
        env:
          EXTENSIONS_ROOT: ${{ inputs.extensions-root || 'packages' }}
        run: |
          echo "Generating MD5 checksums for VSIX files..."

          # Universal + web-target VSIX under packages/
          VSIX_FILES=$(find "$EXTENSIONS_ROOT" -name "*.vsix" -type f)

          if [ -z "$VSIX_FILES" ]; then
            echo "No VSIX files found to generate checksums for"
            echo "checksums_generated=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Create checksums directory structure
          CHECKSUMS_FILE="checksums.md5"
          CHECKSUMS_JSON_FILE="checksums.json"
          > "$CHECKSUMS_FILE"  # Create/clear checksums file
          > "$CHECKSUMS_JSON_FILE"  # Create/clear JSON file
          echo "[" > "$CHECKSUMS_JSON_FILE"

          FIRST=true
          # Generate MD5 checksums for each VSIX file
          while IFS= read -r vsix_file; do
            if [ -f "$vsix_file" ]; then
              # Generate MD5 checksum
              MD5_HASH=$(md5sum "$vsix_file" | cut -d' ' -f1)
              
              # Get relative path for display
              RELATIVE_PATH=$(echo "$vsix_file" | sed "s|^$EXTENSIONS_ROOT/||")
              
              # Get file size
              FILE_SIZE=$(stat -c%s "$vsix_file" 2>/dev/null || stat -f%z "$vsix_file" 2>/dev/null || echo "0")
              
              # Create individual .md5 file alongside VSIX file
              MD5_FILE="${vsix_file}.md5"
              echo "$MD5_HASH  $(basename "$vsix_file")" > "$MD5_FILE"
              
              # Add to combined checksums file
              echo "$MD5_HASH  $RELATIVE_PATH" >> "$CHECKSUMS_FILE"
              
              # Add to JSON file for workflow summary
              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                echo "," >> "$CHECKSUMS_JSON_FILE"
              fi
              echo "  {\"file\":\"$RELATIVE_PATH\",\"md5\":\"$MD5_HASH\",\"size\":\"$FILE_SIZE\"}" >> "$CHECKSUMS_JSON_FILE"
              
              echo "Generated MD5 for: $RELATIVE_PATH"
              echo "  MD5: $MD5_HASH"
              echo "  Size: $FILE_SIZE bytes"
            fi
          done <<< "$VSIX_FILES"

          echo "]" >> "$CHECKSUMS_JSON_FILE"

          # The repository root already contains the generated checksum files.
          if [ "$EXTENSIONS_ROOT" != "." ]; then
            mv "$CHECKSUMS_FILE" "$EXTENSIONS_ROOT/checksums.md5"
            mv "$CHECKSUMS_JSON_FILE" "$EXTENSIONS_ROOT/checksums.json"
          fi

          echo "checksums_generated=true" >> $GITHUB_OUTPUT
          echo "checksums_file=$EXTENSIONS_ROOT/checksums.json" >> $GITHUB_OUTPUT
          # Cache VSIX file list for reuse in validation step
          echo "vsix_files<<EOF" >> $GITHUB_OUTPUT
          echo "$VSIX_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Validate prerelease VSIXs
        if: inputs.pre-release == 'true'
        env:
          VSIX_FILES: ${{ steps.md5-checksums.outputs.vsix_files }}
        run: |
          echo "Validating that VSIXs are marked as prerelease..."

          if [ -z "$VSIX_FILES" ]; then
            echo "No VSIX files found to validate"
            exit 0
          fi

          VALIDATION_FAILED=false

          while IFS= read -r vsix_file; do
            # Check if preRelease flag is set in the VSIX manifest
            # Using unzip -p to pipe directly to grep (no temp directory needed)
            if unzip -p "$vsix_file" extension.vsixmanifest 2>/dev/null | grep -q 'Microsoft.VisualStudio.Code.PreRelease" Value="true"'; then
              echo "PASS: $(basename "$vsix_file") - correctly marked as prerelease"
            else
              echo "FAIL: $(basename "$vsix_file") - NOT marked as prerelease (missing PreRelease flag in manifest)"
              VALIDATION_FAILED=true
            fi
          done <<< "$VSIX_FILES"

          if [ "$VALIDATION_FAILED" = "true" ]; then
            echo ""
            echo "Validation failed: Some VSIXs are not properly marked as prerelease"
            echo "Ensure --pre-release flag is passed to vsce package command"
            exit 1
          fi

          echo "All VSIXs validated as prerelease"

      - name: Calculate artifact name
        id: calc-artifact-name
        env:
          BASE_NAME: ${{ inputs.artifact-name }}
          RUN_NUMBER: ${{ github.run_number }}
          IS_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          # Check if already suffixed
          if [[ "$BASE_NAME" =~ -dry-run$ ]] || [[ "$BASE_NAME" =~ -release$ ]]; then
            ARTIFACT_NAME="$BASE_NAME"
          else
            if [ "$IS_DRY_RUN" = "true" ]; then
              ARTIFACT_NAME="${BASE_NAME}-${RUN_NUMBER}-dry-run"
            else
              ARTIFACT_NAME="${BASE_NAME}-${RUN_NUMBER}-release"
            fi
          fi

          echo "artifact-name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "Artifact name: $ARTIFACT_NAME"

      - name: Validate VSIX artifact glob
        env:
          ARTIFACT_GLOB: ${{ inputs.artifact-glob }}
        run: |
          shopt -s globstar nullglob
          artifacts=( $ARTIFACT_GLOB )
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No VSIX artifacts matched artifact-glob: $ARTIFACT_GLOB"
            echo "Set artifact-glob to match extensions-root when using a non-default extension directory."
            exit 1
          fi

      - name: Upload VSIX artifacts
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.calc-artifact-name.outputs.artifact-name }}
          path: |
            ${{ inputs.artifact-glob }}
            ${{ inputs.extensions-root || 'packages' }}/**/*.vsix.md5
            ${{ inputs.extensions-root || 'packages' }}/checksums.md5
            ${{ inputs.extensions-root || 'packages' }}/checksums.json
          retention-days: 5

      - name: List VSIX files
        env:
          EXTENSIONS_ROOT: ${{ inputs.extensions-root || 'packages' }}
        run: |
          echo "VSIX files created:"
          find "$EXTENSIONS_ROOT" -name "*.vsix" -exec ls -la {} \;

      - name: Add MD5 checksums to workflow summary
        if: steps.md5-checksums.outputs.checksums_generated == 'true'
        run: |
          echo "## MD5 Checksums" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "MD5 checksums for all VSIX extension files:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Extension | MD5 Checksum | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------------|------|" >> $GITHUB_STEP_SUMMARY

          # Read checksums from JSON file and format table
          CHECKSUMS_FILE="${{ steps.md5-checksums.outputs.checksums_file }}"

          if [ -f "$CHECKSUMS_FILE" ]; then
            # Use node to parse JSON and format table
            node -e "
              const fs = require('fs');
              const checksums = JSON.parse(fs.readFileSync('$CHECKSUMS_FILE', 'utf8'));
              checksums.forEach(item => {
                const file = item.file || 'unknown';
                const md5 = item.md5 || 'unknown';
                const size = item.size || '0';
                const sizeFormatted = size !== '0' && size !== 'unknown' ? (parseInt(size) / 1024).toFixed(2) + ' KB' : 'unknown';
                console.log(\`|\${file} |\` + md5 + \` |\${sizeFormatted}|\`);
              });
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "| No checksums available | - | - |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Individual \`.md5\` files are available alongside each VSIX file in the artifacts." >> $GITHUB_STEP_SUMMARY
          echo "A combined \`checksums.md5\` file and \`checksums.json\` file are also included in the artifacts." >> $GITHUB_STEP_SUMMARY
