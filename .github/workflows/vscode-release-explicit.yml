name: VS Code Extension Release (Explicit List)

on:
  workflow_call:
    inputs:
      extensions:
        description: 'JSON array of extension paths (e.g., ["packages/ext1", "packages/ext2"])'
        required: true
        type: string
      registries:
        description: "Where to publish: marketplace | openvsx | all"
        required: false
        type: string
        default: "all"
      pre-release:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: true
      version-bump:
        description: "Version bump strategy: auto | major | minor | patch"
        required: false
        type: string
        default: "auto"
      dry-run:
        description: "Skip actual publishing (for testing)"
        required: false
        type: boolean
        default: false
      package-command:
        description: 'Command to build VSIX packages (e.g., "npm run vscode:package" or "vsce package")'
        required: false
        type: string
        default: "vsce package"
      bundle-command:
        description: 'Command to bundle extension code (e.g., "npm run vscode:bundle"). Set to empty string to skip bundling.'
        required: false
        type: string
        default: "npm run vscode:bundle"
      node-version:
        description: "Node.js version to use"
        required: false
        default: "22.x"
        type: string
      package-manager:
        description: "Package manager to use: npm, pnpm, or yarn"
        required: false
        default: "npm"
        type: string
      package-manager-version:
        description: "pnpm version to use when package-manager is pnpm"
        required: false
        default: "10"
        type: string
      cache-dependency-path:
        description: "Path to the package manager lockfile"
        required: false
        default: "package-lock.json"
        type: string
      install-command:
        description: "Command to install dependencies"
        required: false
        default: "npm ci"
        type: string
    secrets:
      VSCE_PAT:
        description: "VS Code Marketplace Personal Access Token"
        required: false
      OVSX_PAT:
        description: "Open VSX Personal Access Token"
        required: false

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJson(inputs.extensions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js and install dependencies
        uses: salesforcecli/github-workflows/.github/actions/setupNodeAndInstall@ph/W-23773464-enable-pnpm-workflows
        with:
          node-version: ${{ inputs.node-version || '22.x' }}
          package-manager: ${{ inputs.package-manager }}
          package-manager-version: ${{ inputs.package-manager-version }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          install-command: ${{ inputs.install-command }}

      - name: Bundle extension
        if: inputs.bundle-command != ''
        env:
          BUNDLE_COMMAND: ${{ inputs.bundle-command }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          cd "$EXTENSION"
          if jq -e '.scripts["vscode:bundle"]' package.json > /dev/null; then
            bash -c "$BUNDLE_COMMAND"
          else
            echo "Skipping bundle step: vscode:bundle script not found"
          fi

      - name: Build extension
        env:
          EXTENSION: ${{ matrix.extension }}
          PACKAGE_COMMAND: ${{ inputs.package-command }}
        run: |
          cd "$EXTENSION"
          bash -c "$PACKAGE_COMMAND"

      - name: Publish (dry-run)
        if: inputs.dry-run
        env:
          EXTENSION: ${{ matrix.extension }}
          REGISTRIES: ${{ inputs.registries }}
          PRE_RELEASE: ${{ inputs.pre-release }}
        run: |
          echo "🔍 DRY RUN: Would publish $EXTENSION"
          echo "  Registry: $REGISTRIES"
          echo "  Pre-release: $PRE_RELEASE"

      - name: Publish to VS Code Marketplace
        if: |
          !inputs.dry-run &&
          (inputs.registries == 'marketplace' || inputs.registries == 'all')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          EXTENSION: ${{ matrix.extension }}
          PRE_RELEASE_FLAG: ${{ inputs.pre-release && '--pre-release' || '' }}
        run: |
          cd "$EXTENSION"
          npx vsce publish $PRE_RELEASE_FLAG

      - name: Publish to Open VSX
        if: |
          !inputs.dry-run &&
          (inputs.registries == 'openvsx' || inputs.registries == 'all')
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          EXTENSION: ${{ matrix.extension }}
          PRE_RELEASE_FLAG: ${{ inputs.pre-release && '--pre-release' || '' }}
        run: |
          cd "$EXTENSION"
          npx ovsx publish $PRE_RELEASE_FLAG -p "$OVSX_PAT"

      - name: Prepare artifact name
        id: artifact
        run: echo "name=$(echo '${{ matrix.extension }}' | tr '/' '-')-vsix" >> $GITHUB_OUTPUT

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ matrix.extension }}/*.vsix

  summary:
    needs: build-and-publish
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Extensions:** ${{ inputs.extensions }}" >> $GITHUB_STEP_SUMMARY
          echo "**Registries:** ${{ inputs.registries }}" >> $GITHUB_STEP_SUMMARY
          echo "**Pre-release:** ${{ inputs.pre-release }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry-run:** ${{ inputs.dry-run }}" >> $GITHUB_STEP_SUMMARY
