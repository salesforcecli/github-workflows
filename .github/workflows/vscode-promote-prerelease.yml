name: Promote Nightly to Pre-release

# Publishes a nightly build to pre-release on VS Code Marketplace and Open VSX.
#
# NOTE: Callers should use vscode-find-nightly-candidate.yml and check-ci-status action
# BEFORE calling this workflow to implement their own gate-check logic.
#
# Usage:
#   jobs:
#     find-nightly:
#       uses: salesforcecli/github-workflows/.github/workflows/vscode-find-nightly-candidate.yml@main
#       with:
#         min-tag-age-days: '7'
#
#     gate-check:
#       needs: find-nightly
#       runs-on: ubuntu-latest
#       steps:
#         - uses: salesforcecli/github-workflows/.github/actions/vscode/check-ci-status@main
#           with:
#             commit-sha: ${{ needs.find-nightly.outputs.commit-sha }}
#             token: ${{ secrets.GITHUB_TOKEN }}
#             required-checks: '["CI Complete"]'
#
#     promote:
#       needs: [find-nightly, gate-check]
#       uses: salesforcecli/github-workflows/.github/workflows/vscode-promote-prerelease.yml@main
#       with:
#         release-tag: ${{ needs.find-nightly.outputs.nightly-tag }}
#         extension-name: 'apex-lsp-vscode-extension'
#         vsix-name-pattern: 'apex-language-server-extension-*.vsix'
#         exclude-web-vsix: 'true'
#         dry-run: 'false'
#       secrets: inherit
#
# Requirements - calling repository must have:
#   - Nightly tags matching *-nightly.* (e.g., v1.2.3-nightly.20260629)
#   - GitHub releases for each nightly tag with VSIX file(s) attached
#   - Secrets: IDEE_GH_TOKEN, VSCE_PERSONAL_ACCESS_TOKEN, IDEE_OVSX_PAT
#
# Workflow: downloads VSIX → publishes to both marketplaces → creates tracking tag

on:
  workflow_call:
    inputs:
      release-tag:
        description: "Nightly tag to publish (e.g., v67.13.7-nightly.develop.20260820). Callers should use vscode-find-nightly-candidate.yml to find this."
        required: true
        type: string
      extension-name:
        description: "Extension name for tracking tag (e.g., 'apex-lsp-vscode-extension')"
        required: true
        type: string
      vsix-name-pattern:
        description: "Pattern to match VSIX files in release (e.g., 'apex-language-server-extension-*.vsix')"
        required: false
        default: "*.vsix"
        type: string
      exclude-web-vsix:
        description: "Exclude *-web-* VSIX files from promotion"
        required: false
        default: "false"
        type: string
      dry-run:
        description: "Run in dry-run mode (no actual publishing or tagging)"
        required: false
        default: "false"
        type: string
      node-version:
        description: 'Node.js version to use'
        required: false
        default: '22.x'
        type: string
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Nightly tag to publish (e.g., v67.13.7-nightly.develop.20260820)"
        required: true
        type: string
      extension-name:
        description: "Extension name for tracking tag (e.g., 'apex-lsp-vscode-extension')"
        required: true
        type: string
      vsix-name-pattern:
        description: "Pattern to match VSIX files in release (e.g., 'apex-language-server-extension-*.vsix')"
        required: false
        default: "*.vsix"
        type: string
      exclude-web-vsix:
        description: "Exclude *-web-* VSIX files from promotion"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry-run:
        description: "Run in dry-run mode (no actual publishing or tagging)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      node-version:
        description: 'Node.js version to use'
        required: false
        default: '22.x'
        type: string

concurrency:
  group: promote-prerelease
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - registry: vsce
            publish-tool: vsce
          - registry: ovsx
            publish-tool: ovsx
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.IDEE_GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version || '22.x' }}

      - name: Download VSIX from nightly GitHub release
        env:
          GH_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}
          NIGHTLY_TAG: ${{ inputs.release-tag }}
          VSIX_PATTERN: ${{ inputs.vsix-name-pattern || '*.vsix' }}
          EXCLUDE_WEB: ${{ inputs.exclude-web-vsix || 'false' }}
        run: |
          mkdir -p ./vsix-artifacts
          echo "Downloading VSIX from release: $NIGHTLY_TAG"
          gh release download "$NIGHTLY_TAG" \
            --pattern "*.vsix" \
            --dir ./vsix-artifacts \
            --repo "${{ github.repository }}"

          # Find VSIX matching the pattern
          if [ "$EXCLUDE_WEB" = "true" ]; then
            VSIX_FILE=$(find ./vsix-artifacts -type f -name "$VSIX_PATTERN" ! -name '*-web-*' | head -1)
          else
            VSIX_FILE=$(find ./vsix-artifacts -type f -name "$VSIX_PATTERN" | head -1)
          fi

          if [ -z "$VSIX_FILE" ]; then
            echo "No VSIX found matching pattern '$VSIX_PATTERN' in release $NIGHTLY_TAG"
            exit 1
          fi
          echo "Found VSIX: $VSIX_FILE"
          echo "VSIX_PATH=$VSIX_FILE" >> $GITHUB_ENV

      - name: Publish to ${{ matrix.registry }}
        uses: salesforcecli/github-workflows/.github/actions/vscode/publish-vsix@main
        with:
          vsix-path: ${{ env.VSIX_PATH }}
          publish-tool: ${{ matrix.publish-tool }}
          pre-release: "true"
          dry-run: ${{ inputs.dry-run || 'false' }}
        env:
          VSCE_PERSONAL_ACCESS_TOKEN: ${{ secrets.VSCE_PERSONAL_ACCESS_TOKEN }}
          OVSX_PAT: ${{ secrets.IDEE_OVSX_PAT }}

  tag-promoted:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.IDEE_GH_TOKEN }}

      - name: Create marketplace-prerelease tracking tag
        env:
          NIGHTLY_TAG: ${{ inputs.release-tag }}
          EXTENSION_NAME: ${{ inputs.extension-name }}
          DRY_RUN: ${{ inputs.dry-run || 'false' }}
          GH_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}
        run: |
          # Extract version from the nightly tag (format: ...-v<semver>-nightly.*)
          VERSION=$(echo "$NIGHTLY_TAG" | grep -oP '\d+\.\d+\.\d+' | head -1)
          if [ -z "$VERSION" ]; then
            echo "Could not extract version from tag: $NIGHTLY_TAG"
            exit 1
          fi

          # Get commit SHA from the tag
          COMMIT_SHA=$(git rev-list -n 1 "$NIGHTLY_TAG")

          TRACKING_TAG="marketplace-prerelease-${EXTENSION_NAME}-v${VERSION}"

          echo "Creating tracking tag: $TRACKING_TAG → $COMMIT_SHA"

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN: Would create and push tag $TRACKING_TAG"
          else
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
            git fetch --tags origin
            if git tag --list "$TRACKING_TAG" | grep -q .; then
              echo "⏭️ Tracking tag $TRACKING_TAG already exists — skipping (idempotent rerun)"
            else
              git tag "$TRACKING_TAG" "$COMMIT_SHA"
              git push origin "$TRACKING_TAG"
              echo "Tracking tag pushed: $TRACKING_TAG"
            fi
          fi
