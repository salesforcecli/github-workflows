name: Promote Nightly to Pre-release

# Publishes a nightly build to pre-release on VS Code Marketplace and Open VSX.
#
# NOTE: Callers should use vscode-find-nightly-candidate.yml and check-ci-status action
# BEFORE calling this workflow to implement their own gate-check logic.
#
# Usage:
#   jobs:
#     find-nightly:
#       uses: salesforcecli/github-workflows/.github/workflows/vscode-find-nightly-candidate.yml@main
#       with:
#         min-tag-age-days: '7'
#
#     gate-check:
#       needs: find-nightly
#       runs-on: ubuntu-latest
#       steps:
#         - uses: salesforcecli/github-workflows/.github/actions/vscode/check-ci-status@main
#           with:
#             commit-sha: ${{ needs.find-nightly.outputs.commit-sha }}
#             token: ${{ secrets.GITHUB_TOKEN }}
#             required-checks: '["CI Complete"]'
#
#     promote:
#       needs: [find-nightly, gate-check]
#       uses: salesforcecli/github-workflows/.github/workflows/vscode-promote-prerelease.yml@main
#       with:
#         release-tag: ${{ needs.find-nightly.outputs.nightly-tag }}
#         extension-name: 'apex-lsp-vscode-extension'
#         vsix-name-pattern: 'apex-language-server-extension-*.vsix'
#         exclude-web-vsix: 'true'
#         dry-run: 'false'
#       secrets: inherit
#
# Requirements - calling repository must have:
#   - Nightly tags matching *-nightly.* (e.g., v1.2.3-nightly.20260629)
#   - GitHub releases for each nightly tag with VSIX file(s) attached
#   - Secrets: IDEE_GH_TOKEN, VSCE_PERSONAL_ACCESS_TOKEN
#   - Open VSX publishes via OIDC trusted publishing (--trusted-publishing) -- no secret needed,
#     but the registry's trusted-publisher config must list this workflow file
#
# Workflow: downloads VSIX → publishes to both marketplaces → creates tracking tag

on:
  workflow_call:
    inputs:
      release-tag:
        description: "Nightly tag to publish (e.g., v67.13.7-nightly.develop.20260820). Callers should use vscode-find-nightly-candidate.yml to find this."
        required: true
        type: string
      extension-name:
        description: "Extension name for tracking tag (e.g., 'apex-lsp-vscode-extension')"
        required: true
        type: string
      vsix-name-pattern:
        description: "Pattern to match VSIX files in release (e.g., 'apex-language-server-extension-*.vsix')"
        required: false
        default: "*.vsix"
        type: string
      exclude-web-vsix:
        description: "Exclude *-web-* VSIX files from promotion"
        required: false
        default: "false"
        type: string
      dry-run:
        description: "Run in dry-run mode (no actual publishing or tagging)"
        required: false
        default: "false"
        type: string
      node-version:
        description: 'Node.js version to use'
        required: false
        default: '22.x'
        type: string
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Nightly tag to publish (e.g., v67.13.7-nightly.develop.20260820)"
        required: true
        type: string
      extension-name:
        description: "Extension name for tracking tag (e.g., 'apex-lsp-vscode-extension')"
        required: true
        type: string
      vsix-name-pattern:
        description: "Pattern to match VSIX files in release (e.g., 'apex-language-server-extension-*.vsix')"
        required: false
        default: "*.vsix"
        type: string
      exclude-web-vsix:
        description: "Exclude *-web-* VSIX files from promotion"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry-run:
        description: "Run in dry-run mode (no actual publishing or tagging)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      node-version:
        description: 'Node.js version to use'
        required: false
        default: '22.x'
        type: string

concurrency:
  group: promote-prerelease
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: read
  # ovsx exchanges this for a short-lived Open VSX publishing token (--trusted-publishing in the
  # publish job below); vsce/Marketplace still uses VSCE_PERSONAL_ACCESS_TOKEN.
  id-token: write

jobs:
  publish-vsce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.IDEE_GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version || '22.x' }}

      - name: Download VSIXs from nightly GitHub release
        env:
          GH_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}
          NIGHTLY_TAG: ${{ inputs.release-tag }}
        run: |
          mkdir -p ./vsix-artifacts
          echo "Downloading VSIXs from release: $NIGHTLY_TAG"
          gh release download "$NIGHTLY_TAG" \
            --pattern "*.vsix" \
            --dir ./vsix-artifacts \
            --repo "${{ github.repository }}"

      - name: Publish to Visual Studio Marketplace
        env:
          NIGHTLY_TAG: ${{ inputs.release-tag }}
          VSIX_PATTERN: ${{ inputs.vsix-name-pattern || '*.vsix' }}
          EXCLUDE_WEB: ${{ inputs.exclude-web-vsix || 'false' }}
          DRY_RUN: ${{ inputs.dry-run || 'false' }}
          VSCE_PERSONAL_ACCESS_TOKEN: ${{ secrets.VSCE_PERSONAL_ACCESS_TOKEN }}
        run: |
          set -uo pipefail

          # Collect every VSIX matching the caller's pattern (all extensions in a
          # monorepo; a single file for single-extension repos).
          VSIX_FILES=()
          if [ "$EXCLUDE_WEB" = "true" ]; then
            while IFS= read -r f; do VSIX_FILES+=("$f"); done < <(find ./vsix-artifacts -type f -name "$VSIX_PATTERN" ! -name '*-web-*' | sort)
          else
            while IFS= read -r f; do VSIX_FILES+=("$f"); done < <(find ./vsix-artifacts -type f -name "$VSIX_PATTERN" | sort)
          fi

          if [ "${#VSIX_FILES[@]}" -eq 0 ]; then
            echo "::error::No VSIX found matching pattern '$VSIX_PATTERN' in release $NIGHTLY_TAG"
            exit 1
          fi

          TOKEN="$VSCE_PERSONAL_ACCESS_TOKEN"
          if [ "$DRY_RUN" != "true" ] && [ -z "$TOKEN" ]; then
            echo "::error::Token for vsce is not set"
            exit 1
          fi

          echo "Publishing ${#VSIX_FILES[@]} VSIX(s) as pre-release to Visual Studio Marketplace:"
          printf '  %s\n' "${VSIX_FILES[@]}"

          RUN_ID="${{ github.run_id }}"
          ACTOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          FAILED=0

          # Marketplace gallery requests can sit until typed-rest-client's 180s
          # socket timeout. vsce has no timeout flag; retry per VSIX.
          # --skip-duplicate makes a retry a no-op if the first attempt committed.
          publish_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              echo "Publish attempt ${attempt}/3"
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Publish failed; retrying in 15s..."
                sleep 15
              fi
            done
            return 1
          }

          for VSIX in "${VSIX_FILES[@]}"; do
            NAME=$(basename "$VSIX")
            echo "::group::$NAME → Visual Studio Marketplace"

            # Audit trail (mirrors the publish-vsix action's per-file record)
            HASH=$(sha256sum "$VSIX" 2>/dev/null | cut -d' ' -f1 || echo "unknown")
            echo "[AUDIT] actor=$ACTOR repo=$REPO run_id=$RUN_ID tool=vsce file=$NAME hash=$HASH pre_release=true dry_run=$DRY_RUN"

            if [ "$DRY_RUN" = "true" ]; then
              echo "🔍 DRY RUN - would publish $NAME (pre-release)"
              echo "::endgroup::"
              continue
            fi

            if VSCE_PAT="$TOKEN" publish_with_retry npx @vscode/vsce publish --packagePath "$VSIX" --skip-duplicate --pre-release; then
              echo "✅ Published $NAME to Visual Studio Marketplace"
            else
              echo "::error::Failed to publish $NAME to Visual Studio Marketplace"
              FAILED=1
            fi
            echo "::endgroup::"
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more VSIX publishes failed for vsce"
            exit 1
          fi
          echo "✅ All ${#VSIX_FILES[@]} VSIX(s) processed for Visual Studio Marketplace"

  # ovsx publishing delegates to the shared workflow stable releases already use (rather than
  # running its own `ovsx publish`), so every Open VSX publish for this extension -- prerelease
  # and stable alike -- requests its OIDC token from the same job_workflow_ref. Open VSX's
  # trusted-publisher config is one identity per extension, keyed on that exact file, so two
  # different files here would mean only one of the two publish paths could ever be trusted.
  publish-ovsx:
    permissions:
      contents: read
      id-token: write
    uses: salesforcecli/github-workflows/.github/workflows/openvsx-publish-release-vsix.yml@main
    with:
      release-tag: ${{ inputs.release-tag }}
      vsix-name-pattern: ${{ inputs.vsix-name-pattern || '*.vsix' }}
      exclude-web-vsix: ${{ inputs.exclude-web-vsix || 'false' }}
      # This workflow's own dry-run input is a string ('true'/'false'); the callee's is boolean.
      dry-run: ${{ (inputs.dry-run || 'false') == 'true' }}
    secrets: inherit

  tag-promoted:
    needs: [publish-vsce, publish-ovsx]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.IDEE_GH_TOKEN }}

      - name: Create marketplace-prerelease tracking tag
        env:
          NIGHTLY_TAG: ${{ inputs.release-tag }}
          EXTENSION_NAME: ${{ inputs.extension-name }}
          DRY_RUN: ${{ inputs.dry-run || 'false' }}
          GH_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}
        run: |
          # Extract version from the nightly tag (format: ...-v<semver>-nightly.*)
          VERSION=$(echo "$NIGHTLY_TAG" | grep -oP '\d+\.\d+\.\d+' | head -1)
          if [ -z "$VERSION" ]; then
            echo "Could not extract version from tag: $NIGHTLY_TAG"
            exit 1
          fi

          # Get commit SHA from the tag
          COMMIT_SHA=$(git rev-list -n 1 "$NIGHTLY_TAG")

          TRACKING_TAG="marketplace-prerelease-${EXTENSION_NAME}-v${VERSION}"

          echo "Creating tracking tag: $TRACKING_TAG → $COMMIT_SHA"

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN: Would create and push tag $TRACKING_TAG"
          else
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
            git fetch --tags origin
            if git tag --list "$TRACKING_TAG" | grep -q .; then
              echo "⏭️ Tracking tag $TRACKING_TAG already exists — skipping (idempotent rerun)"
            else
              git tag "$TRACKING_TAG" "$COMMIT_SHA"
              git push origin "$TRACKING_TAG"
              echo "Tracking tag pushed: $TRACKING_TAG"
            fi
          fi
