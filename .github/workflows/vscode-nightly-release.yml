name: VS Code Extension Nightly Release

on:
  workflow_call:
    inputs:
      extension-paths:
        description: 'Glob pattern or list of extension paths (e.g., packages/*)'
        required: true
        type: string
      release-mode:
        description: 'Release mode: all | changed | specific'
        required: false
        type: string
        default: 'changed'
      base-branch:
        description: 'Base branch for change detection'
        required: false
        type: string
        default: 'main'
      registries:
        description: 'Where to publish: marketplace | openvsx | all'
        required: false
        type: string
        default: 'all'
      pre-release:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: true
      version-bump:
        description: 'Version bump strategy: auto | major | minor | patch'
        required: false
        type: string
        default: 'auto'
      dry-run:
        description: 'Skip actual publishing (for testing)'
        required: false
        type: boolean
        default: false
      package-command:
        description: 'Command to build VSIX packages (e.g., "npm run vscode:package" or "vsce package")'
        required: false
        type: string
        default: 'vsce package'
      bundle-command:
        description: 'Command to bundle extension code (e.g., "npm run vscode:bundle"). Set to empty string to skip bundling.'
        required: false
        type: string
        default: 'npm run vscode:bundle'
    secrets:
      VSCE_PAT:
        description: 'VS Code Marketplace Personal Access Token'
        required: false
      OVSX_PAT:
        description: 'Open VSX Personal Access Token'
        required: false

jobs:
  detect-extensions:
    runs-on: ubuntu-latest
    outputs:
      extensions: ${{ steps.find.outputs.extensions }}
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for change detection

      - name: Find extensions
        id: find
        shell: bash
        run: |
          echo "Finding extensions matching: ${{ inputs.extension-paths }}"

          extensions=()
          for pattern in ${{ inputs.extension-paths }}; do
            for path in $pattern; do
              if [ -d "$path" ] && [ -f "$path/package.json" ]; then
                # Verify it's a VS Code extension
                if jq -e '.engines.vscode' "$path/package.json" > /dev/null 2>&1; then
                  extensions+=("$path")
                  echo "✓ Found extension: $path"
                fi
              fi
            done
          done

          # Convert to JSON array
          if [ ${#extensions[@]} -eq 0 ]; then
            extension_json="[]"
          else
            extension_json=$(printf '%s\n' "${extensions[@]}" | jq -R . | jq -s -c .)
          fi
          echo "extensions=$extension_json" >> $GITHUB_OUTPUT
          echo "Found ${#extensions[@]} extensions"

      - name: Detect changes
        id: detect
        if: inputs.release-mode == 'changed'
        shell: bash
        run: |
          echo "Detecting changes since ${{ inputs.base-branch }}"

          # Get list of changed files
          git fetch origin ${{ inputs.base-branch }}
          changed_files=$(git diff --name-only origin/${{ inputs.base-branch }}...HEAD)

          # Filter extensions with changes
          changed_extensions=()
          extensions=$(echo '${{ steps.find.outputs.extensions }}' | jq -r '.[]')

          while IFS= read -r ext; do
            if echo "$changed_files" | grep -q "^$ext/"; then
              changed_extensions+=("$ext")
              echo "✓ Changed: $ext"
            fi
          done <<< "$extensions"

          # Convert to JSON
          if [ ${#changed_extensions[@]} -eq 0 ]; then
            changed_json="[]"
          else
            changed_json=$(printf '%s\n' "${changed_extensions[@]}" | jq -R . | jq -s -c .)
          fi
          echo "changed=$changed_json" >> $GITHUB_OUTPUT
          echo "Found ${#changed_extensions[@]} changed extensions"

  build-and-publish:
    needs: detect-extensions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extension: ${{ fromJson(needs.detect-extensions.outputs.extensions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: Bundle extension
        if: inputs.bundle-command != ''
        run: |
          cd ${{ matrix.extension }}
          # Check if the bundle script exists in package.json
          if npm run | grep -q "vscode:bundle"; then
            ${{ inputs.bundle-command }}
          else
            echo "⏭️ Skipping bundle step - vscode:bundle script not found"
          fi

      - name: Build extension
        run: |
          cd ${{ matrix.extension }}
          ${{ inputs.package-command }}

      - name: Publish (dry-run)
        if: inputs.dry-run
        run: |
          echo "🔍 DRY RUN: Would publish ${{ matrix.extension }}"
          echo "  Registry: ${{ inputs.registries }}"
          echo "  Pre-release: ${{ inputs.pre-release }}"

      - name: Publish to VS Code Marketplace
        if: |
          !inputs.dry-run &&
          (inputs.registries == 'marketplace' || inputs.registries == 'all')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          cd ${{ matrix.extension }}
          npx vsce publish ${{ inputs.pre-release && '--pre-release' || '' }}

      - name: Publish to Open VSX
        if: |
          !inputs.dry-run &&
          (inputs.registries == 'openvsx' || inputs.registries == 'all')
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          cd ${{ matrix.extension }}
          npx ovsx publish ${{ inputs.pre-release && '--pre-release' || '' }} -p $OVSX_PAT

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.extension }}-vsix
          path: ${{ matrix.extension }}/*.vsix

  summary:
    needs: [detect-extensions, build-and-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Nightly Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ inputs.release-mode }}" >> $GITHUB_STEP_SUMMARY
          echo "**Extensions:** ${{ needs.detect-extensions.outputs.extensions }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.release-mode }}" == "changed" ]; then
            echo "**Changed:** ${{ needs.detect-extensions.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Dry-run:** ${{ inputs.dry-run }}" >> $GITHUB_STEP_SUMMARY
