name: Publish Release VSIXs to Open VSX

on:
  workflow_call:
    inputs:
      release-tag:
        description: GitHub release tag containing the VSIX assets
        required: true
        type: string
      dry-run:
        description: Download and inspect VSIXs without publishing
        required: false
        default: false
        type: boolean
      vsix-name-pattern:
        description: Glob of downloaded VSIX file names to publish
        required: false
        default: '*.vsix'
        type: string
      exclude-web-vsix:
        description: Exclude *-web-* VSIXs from publishing
        required: false
        default: 'false'
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # ovsx exchanges this job's OIDC ID token for a short-lived Open VSX publishing token
      # (--trusted-publishing below) -- without this, there is no token to exchange.
      id-token: write
    steps:
      - name: Download release VSIXs
        id: release
        uses: salesforcecli/github-workflows/.github/actions/vscode/download-release-vsix@main
        with:
          release-tag: ${{ inputs.release-tag }}

      - name: Publish VSIXs
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          PRE_RELEASE: ${{ steps.release.outputs.pre-release }}
          VSIX_PATTERN: ${{ inputs.vsix-name-pattern }}
          EXCLUDE_WEB: ${{ inputs.exclude-web-vsix }}
        run: |
          # Open VSX can hang the same way as vsce; retry per VSIX.
          # --skip-duplicate makes a retry a no-op if the first attempt committed.
          publish_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              echo "Publish attempt ${attempt}/3"
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Publish failed; retrying in 15s..."
                sleep 15
              fi
            done
            return 1
          }

          while IFS= read -r -d '' vsix; do
            args=("$vsix" --trusted-publishing --skip-duplicate)
            pre_release_suffix=''
            if [ "$PRE_RELEASE" = true ]; then
              args+=(--pre-release)
              pre_release_suffix=' --pre-release'
            fi

            if [ "$DRY_RUN" = true ]; then
              echo "Would publish $vsix to Open VSX with --skip-duplicate${pre_release_suffix}"
              continue
            fi

            if ! publish_with_retry npx ovsx publish "${args[@]}"; then
              echo "::error::Failed to publish $vsix after 3 attempts"
              exit 1
            fi
          done < <(
            if [ "$EXCLUDE_WEB" = "true" ]; then
              find extensions -type f -name "$VSIX_PATTERN" ! -iname '*-web-*' -print0
            else
              find extensions -type f -name "$VSIX_PATTERN" -print0
            fi
          )
