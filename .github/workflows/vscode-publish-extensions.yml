name: Publish VS Code Extensions

# Reusable workflow for building, versioning, and publishing VS Code extensions
#
# Usage from consuming repository:
#   jobs:
#     publish:
#       uses: salesforcecli/github-workflows/.github/workflows/vscode/publish-extensions.yml@main
#       with:
#         extensions: changed      # or 'all' or specific extension names
#         registries: all          # or 'vsce' or 'ovsx'
#         pre-release: true        # true for nightly/pre-release, false for stable
#         dry-run: false
#       secrets: inherit
#
# Requirements:
#   - Requires jq for JSON manipulation (pre-installed on GitHub runners)
#   - Requires secrets: IDEE_GH_TOKEN, VSCE_PERSONAL_ACCESS_TOKEN, IDEE_OVSX_PAT
#
# Features:
#   - Auto-detects changed extensions
#   - Smart version bumping (even/odd minor for stable/pre-release)
#   - Conventional commit analysis
#   - GitHub release creation with VSIX artifacts
#   - Marketplace publishing (can be skipped for nightly by setting registries appropriately)
#
# Versioning Strategy:
#   This workflow uses an odd/even minor version convention to distinguish release types:
#   - Nightly builds:    odd minor versions (e.g., 0.5.x-nightly.20260709)
#   - Pre-release:       odd minor versions (e.g., 0.5.3)
#   - Stable releases:   even minor versions (e.g., 0.6.0)
#
#   Benefits:
#   - Clear visual distinction between release channels
#   - Prevents accidental stable overwrites of pre-release versions
#   - Predictable version progression: nightly 0.5.x → pre-release 0.5.y → stable 0.6.0
#
#   Version bump logic:
#   - major: Breaking change, bumps to next major with first odd minor (e.g., 0.5.3 → 1.1.0)
#   - minor: New feature, bumps to next odd minor (e.g., 0.5.3 → 0.7.0)
#   - patch: Bug fix, increments patch while maintaining odd minor (e.g., 0.5.3 → 0.5.4)
#   - auto:  Analyzes conventional commits to determine bump type
#
#   Note: This convention is specific to VS Code extension release workflows. If your
#   project uses a different versioning strategy, you may need to customize the version
#   bumping logic in the bump-versions job.

on:
  workflow_call:
    inputs:
      branch:
        description: "Branch to release from"
        required: false
        default: "main"
        type: string
      extensions:
        description: "Extensions to release (all, changed, or comma-separated extension names)"
        required: false
        default: "changed"
        type: string
      registries:
        description: "Registries to publish to (all, vsce, ovsx)"
        required: false
        default: "all"
        type: string
      available-extensions:
        description: "Available VS Code extensions"
        required: false
        type: string
      dry-run:
        description: "Run in dry-run mode (no actual publishing)"
        required: false
        default: "false"
        type: string
      pre-release:
        description: "Publish as pre-release version"
        required: false
        default: "true"
        type: string
      nightly:
        description: "Use nightly-release versioning and skip public marketplace publishing"
        required: false
        default: true
        type: boolean

      version-bump:
        description: "Version bump type (auto, patch, minor, major)"
        required: false
        default: "auto"
        type: string
      extensions-root:
        description: "Root directory for extensions (default: packages)"
        required: false
        default: "packages"
        type: string
      exclude-web-vsix:
        description: "Exclude *-web-* VSIX files from publishing and releases"
        required: false
        default: "false"
        type: string
      slack-notification-title:
        description: "Title for Slack success notifications"
        required: false
        default: "🎉 Extensions Released Successfully!"
        type: string
      node-version:
        description: "Node.js version to use"
        required: false
        default: "22.x"
        type: string
      git-user-name:
        description: "Git user name for version bump commits"
        required: false
        default: "GitHub Action"
        type: string
      git-user-email:
        description: "Git user email for version bump commits"
        required: false
        default: "action@github.com"
        type: string
      package-manager:
        description: "Package manager to use: npm, pnpm, or yarn"
        required: false
        default: "npm"
        type: string
      package-manager-version:
        description: "pnpm version to use when package-manager is pnpm"
        required: false
        default: "10"
        type: string
      cache-dependency-path:
        description: "Path to the package manager lockfile"
        required: false
        default: "package-lock.json"
        type: string
      install-command:
        description: "Command used to install dependencies"
        required: false
        default: "npm ci"
        type: string
      package-command:
        description: "Command used to create VSIX artifacts"
        required: false
        default: "npm run package:packages"
        type: string
      prerelease-package-command:
        description: "Command used to create prerelease VSIX artifacts"
        required: false
        default: "npm run package:packages:prerelease"
        type: string
      web-package-command:
        description: "Optional command used to create a web-target VSIX artifact"
        required: false
        default: ""
        type: string
      web-prerelease-package-command:
        description: "Optional command used to create a prerelease web-target VSIX artifact"
        required: false
        default: ""
        type: string
      artifact-glob:
        description: "Glob for VSIX artifacts relative to the repository root"
        required: false
        default: "packages/**/*.vsix"
        type: string
      publish-web-vsix:
        description: "Require and publish a web-target VSIX to the CBWeb internal marketplace"
        required: false
        default: false
        type: boolean
    secrets:
      IDEE_GH_TOKEN:
        description: "GitHub token used for release commits and tags"
        required: false
      VSCE_PERSONAL_ACCESS_TOKEN:
        description: "VS Code Marketplace publishing token"
        required: false
      IDEE_OVSX_PAT:
        description: "Open VSX publishing token"
        required: false
      MARKETPLACE_DEPLOY_TOKEN:
        description: "CBWeb internal marketplace publishing token"
        required: false
      IDEE_MAIN_SLACK_WEBHOOK:
        description: "Slack notification webhook"
        required: false

# Add explicit permissions for security
permissions:
  contents: write # Needed for version bumps and releases
  packages: write # Needed for publishing to registries
  actions: read

jobs:
  display-release-plan:
    needs: [determine-changes]
    runs-on: ubuntu-latest
    if: needs.determine-changes.outputs.selected-extensions != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup Node.js and install dependencies
        uses: salesforcecli/github-workflows/.github/actions/setupNodeAndInstall@main
        with:
          node-version: ${{ inputs.node-version || '22.x' }}
          package-manager: ${{ inputs.package-manager }}
          package-manager-version: ${{ inputs.package-manager-version }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          install-command: ${{ inputs.install-command }}

      - name: Display Extension Release Plan
        env:
          BRANCH: ${{ inputs.branch || github.ref_name }}
          BUILD_TYPE: ${{ github.event_name }}
          IS_NIGHTLY: ${{ inputs.nightly && 'true' || 'false' }}
          VERSION_BUMP: ${{ needs.determine-changes.outputs.version-bumps }}
          REGISTRIES: ${{ inputs.registries }}
          PRE_RELEASE: ${{ inputs.pre-release || github.event.inputs.pre-release || 'false' }}
          SELECTED_EXTENSIONS: ${{ needs.determine-changes.outputs.selected-extensions }}
          EXTENSIONS_ROOT: ${{ inputs.extensions-root || 'packages' }}
        run: |
          echo "=== EXTENSION RELEASE PLAN ==="
          echo "Branch: $BRANCH"
          echo "Build type: $BUILD_TYPE"
          echo "Is nightly: $IS_NIGHTLY"
          echo "Version bump type: $VERSION_BUMP"
          echo "Registries: $REGISTRIES"
          echo "Pre-release: $PRE_RELEASE"
          echo "Dry run mode: ENABLED"
          echo ""
          echo "Extensions to release: $SELECTED_EXTENSIONS"
          echo ""

          IFS=',' read -ra extensions <<< "$SELECTED_EXTENSIONS"
          for ext in "${extensions[@]}"; do
            [ -z "$ext" ] && continue

            package_json="$EXTENSIONS_ROOT/$ext/package.json"
            if [ ! -f "$package_json" ]; then
              echo "Extension: $ext (package.json not found)"
              continue
            fi

            current_version=$(jq -r '.version' "$package_json")
            publisher=$(jq -r '.publisher // "N/A"' "$package_json")

            echo "Extension: $ext"
            echo "  Current version: $current_version"
            echo "  Publisher: $publisher"

            if [ "$IS_NIGHTLY" = "true" ]; then
              echo "  Version strategy: Nightly build (odd minor + nightly timestamp)"
            elif [ "$PRE_RELEASE" = "true" ]; then
              echo "  Version strategy: Pre-release (odd minor version)"
            else
              echo "  Version strategy: Stable release (even minor version)"
            fi

            echo "  Would create GitHub release"
            echo "  Would package VSIX"

            case "$REGISTRIES" in
              marketplace) echo "  Would publish to: VS Code Marketplace only" ;;
              openvsx) echo "  Would publish to: Open VSX only" ;;
              all) echo "  Would publish to: VS Code Marketplace and Open VSX" ;;
            esac
            echo ""
          done

          echo "=== END OF RELEASE PLAN ==="

  determine-changes:
    runs-on: ubuntu-latest
    outputs:
      selected-extensions: ${{ steps.changes.outputs.selected-extensions }}
      version-bumps: ${{ steps.changes.outputs.version-bumps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Need full history for git diff against tags

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version || '22.x' }}

      - name: Detect changes and version bumps
        id: changes
        env:
          IS_NIGHTLY: ${{ inputs.nightly && 'true' || 'false' }}
          VERSION_BUMP: ${{ inputs.version-bump }}
          PRE_RELEASE: ${{ inputs.pre-release || 'true' }}
          IS_PROMOTION: "false"
          SELECTED_EXTENSIONS: ${{ inputs.extensions }}
          EXTENSIONS_ROOT: ${{ inputs.extensions-root || 'packages' }}
        run: |
          # Download the change detection scripts from salesforcecli/github-workflows
          SCRIPTS_URL="https://raw.githubusercontent.com/salesforcecli/github-workflows/main/.github/scripts"
          mkdir -p .github/scripts

          echo "Downloading change detection scripts..."
          curl -sS "$SCRIPTS_URL/ext-change-detector.ts" -o .github/scripts/ext-change-detector.ts
          curl -sS "$SCRIPTS_URL/types.ts" -o .github/scripts/types.ts
          curl -sS "$SCRIPTS_URL/utils.ts" -o .github/scripts/utils.ts
          curl -sS "$SCRIPTS_URL/index.ts" -o .github/scripts/index.ts

          echo "Installing change detection dependencies..."
          npm install --no-save simple-git@3.27.0 chalk@5.3.0 semver@7.6.3 zod@3.24.1 tsx@4.19.2

          echo "Running change detection..."
          npx tsx .github/scripts/index.ts ext-change-detector

  bump-versions:
    needs: [determine-changes]
    runs-on: ubuntu-latest
    if: needs.determine-changes.outputs.selected-extensions != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.IDEE_GH_TOKEN || github.token }}
          fetch-depth: 0

      - name: Setup Node.js and install dependencies
        uses: salesforcecli/github-workflows/.github/actions/setupNodeAndInstall@main
        with:
          node-version: ${{ inputs.node-version || '22.x' }}
          package-manager: ${{ inputs.package-manager }}
          package-manager-version: ${{ inputs.package-manager-version }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          install-command: ${{ inputs.install-command }}

      - name: Bump versions and tag for selected extensions
        env:
          VERSION_BUMP: ${{ needs.determine-changes.outputs.version-bumps }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          DRY_RUN: ${{ inputs.dry-run || github.event.inputs.dry-run || 'false' }}
          SELECTED_EXTENSIONS: ${{ needs.determine-changes.outputs.selected-extensions }}
          PRE_RELEASE: ${{ inputs.pre-release || github.event.inputs.pre-release || 'false' }}
          IS_NIGHTLY: ${{ inputs.nightly && 'true' || 'false' }}
          IS_PROMOTION: "false"
          BRANCH: ${{ inputs.branch || github.ref_name }}
          EXTENSIONS_ROOT: ${{ inputs.extensions-root || 'packages' }}
        run: |
          set -e

          case "$PACKAGE_MANAGER" in
            pnpm) unexpected_lockfiles=(package-lock.json yarn.lock) ;;
            yarn) unexpected_lockfiles=(package-lock.json pnpm-lock.yaml) ;;
            npm) unexpected_lockfiles=(pnpm-lock.yaml yarn.lock) ;;
          esac
          declare -A unexpected_lockfile_hashes
          for lockfile in "${unexpected_lockfiles[@]}"; do
            unexpected_lockfile_hashes["$lockfile"]=$(git hash-object "$lockfile" 2>/dev/null || echo missing)
          done

          # Function to parse semantic version
          parse_version() {
            local version=$1
            echo "$version" | awk -F. '{print $1, $2, $3}'
          }

          # Function to calculate new version based on strategy
          calculate_new_version() {
            local current=$1
            local bump_type=$2
            local is_nightly=$3
            local is_promotion=$4
            local is_prerelease=$5

            read -r major minor patch <<< $(parse_version "$current")

            if [ "$is_nightly" = "true" ]; then
              # Nightly: enforce odd minor versions
              case "$bump_type" in
                major)
                  # Breaking change: new major, start at first odd minor
                  echo "$((major + 1)).1.0"
                  ;;
                minor)
                  # New feature: skip to next odd minor
                  if [ $((minor % 2)) -eq 0 ]; then
                    echo "$major.$((minor + 1)).0"
                  else
                    echo "$major.$((minor + 2)).0"
                  fi
                  ;;
                *)
                  # Patch/auto: ensure odd minor then increment patch
                  if [ $((minor % 2)) -eq 0 ]; then
                    echo "$major.$((minor + 1)).0"
                  else
                    echo "$major.$minor.$((patch + 1))"
                  fi
                  ;;
              esac
            elif [ "$is_promotion" = "true" ]; then
              # Promotion: bump from odd (nightly) to even (stable)
              if [ $((minor % 2)) -eq 1 ]; then
                echo "$major.$((minor + 1)).0"
              else
                echo >&2 "Warning: Current version has even minor, expected odd for promotion"
                echo "$major.$((minor + 2)).0"
              fi
            else
              # Regular build
              case "$bump_type" in
                patch)
                  echo "$major.$minor.$((patch + 1))"
                  ;;
                minor)
                  if [ "$is_prerelease" = "true" ]; then
                    # Pre-release: ensure odd minor
                    if [ $((minor % 2)) -eq 0 ]; then
                      echo "$major.$((minor + 1)).0"
                    else
                      echo "$major.$((minor + 2)).0"
                    fi
                  else
                    # Stable: ensure even minor
                    if [ $((minor % 2)) -eq 1 ]; then
                      echo "$major.$((minor + 1)).0"
                    else
                      echo "$major.$((minor + 2)).0"
                    fi
                  fi
                  ;;
                major)
                  if [ "$is_prerelease" = "true" ]; then
                    echo "$((major + 1)).1.0"
                  else
                    echo "$((major + 1)).0.0"
                  fi
                  ;;
                auto|*)
                  echo "$major.$minor.$((patch + 1))"
                  ;;
              esac
            fi
          }

          # Function to create git tag
          create_git_tag() {
            local package_name=$1
            local version=$2
            local is_prerelease=$3
            local is_nightly=$4

            local tag_name
            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY RUN: Would create tag for $package_name $version"
              return 0
            fi

            if [ "$is_nightly" = "true" ]; then
              # Nightly format: v{version}-nightly[.branch].{date}
              local nightly_date=$(date -u +%Y%m%d)
              local branch_suffix=""
              if [ "$BRANCH" != "main" ] && [ "$BRANCH" != "master" ]; then
                branch_suffix=".$(echo "$BRANCH" | tr '/' '-')"
              fi
              tag_name="v${version}-nightly${branch_suffix}.${nightly_date}"
            else
              # Regular format: {package}-v{version}[-pre-release]
              if [ "$is_prerelease" = "true" ]; then
                tag_name="${package_name}-v${version}-pre-release"
              else
                tag_name="${package_name}-v${version}"
              fi
            fi

            # Check if tag already exists (idempotency)
            if git rev-parse "$tag_name" >/dev/null 2>&1 || git ls-remote --tags origin "$tag_name" 2>/dev/null | grep -q "$tag_name"; then
              echo "⏭️ Tag $tag_name already exists — skipping (idempotent rerun)"
              return 0
            fi

            echo "Creating tag $tag_name..."
            git tag "$tag_name"
            echo "✅ Tag created: $tag_name"
          }

          # Main version bump logic
          echo "=== Version Bumping ==="
          echo "Strategy: $VERSION_BUMP"
          echo "Pre-release: $PRE_RELEASE"
          echo "Is nightly: $IS_NIGHTLY"
          echo "Is promotion: $IS_PROMOTION"
          echo ""

          IFS=',' read -ra extensions <<< "$SELECTED_EXTENSIONS"
          for ext in "${extensions[@]}"; do
            ext=$(echo "$ext" | xargs)  # Trim whitespace
            [ -z "$ext" ] && continue

            package_json="$EXTENSIONS_ROOT/$ext/package.json"
            if [ ! -f "$package_json" ]; then
              echo "⚠️ Skipping $ext: package.json not found"
              continue
            fi

            # Read current version and package name
            current_version=$(jq -r '.version' "$package_json")
            package_name=$(jq -r '.name' "$package_json")

            # Calculate new version
            new_version=$(calculate_new_version "$current_version" "$VERSION_BUMP" "$IS_NIGHTLY" "$IS_PROMOTION" "$PRE_RELEASE")

            echo "📦 $ext"
            echo "  Current: $current_version"
            echo "  New: $new_version"

            # Update package.json
            jq --arg ver "$new_version" '.version = $ver' "$package_json" > "${package_json}.tmp"
            mv "${package_json}.tmp" "$package_json"

            # Create git tag
            create_git_tag "$package_name" "$new_version" "$PRE_RELEASE" "$IS_NIGHTLY"

            echo ""
          done

          if [ "$PACKAGE_MANAGER" = "pnpm" ]; then
            pnpm install --lockfile-only --ignore-scripts
          elif [ "$PACKAGE_MANAGER" = "yarn" ]; then
            yarn install --ignore-scripts
          else
            npm install --package-lock-only --ignore-scripts
          fi

          for lockfile in "${unexpected_lockfiles[@]}"; do
            current_hash=$(git hash-object "$lockfile" 2>/dev/null || echo missing)
            if [ "${unexpected_lockfile_hashes[$lockfile]}" != "$current_hash" ]; then
              echo "$PACKAGE_MANAGER version bumps must not create or modify $lockfile"
              exit 1
            fi
          done

          echo "✅ Version bumping complete"

      - name: Validate GitHub authentication
        if: inputs.dry-run != 'true' && github.event.inputs.dry-run != 'true'
        env:
          GH_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}
        run: |
          # Validate that required tokens are present
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ Error: GH_TOKEN is not set"
            exit 1
          fi

          # Test GitHub CLI authentication
          if ! gh auth status >/dev/null 2>&1; then
            echo "❌ Error: GitHub CLI authentication failed"
            exit 1
          fi

          echo "✅ GitHub authentication validated"

      # If the branch push succeeds but tag push fails, do NOT re-run this job.
      # Manually push the missing tags: git push origin --tags
      - name: Commit version bumps with tags
        env:
          # Ensure GitHub CLI has proper authentication
          GITHUB_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run || github.event.inputs.dry-run || 'false' }}
          GIT_USER_NAME: ${{ inputs.git-user-name }}
          GIT_USER_EMAIL: ${{ inputs.git-user-email }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "🔄 DRY RUN: Would commit and push version bumps..."
            echo "📋 DRY RUN: Changes that would be committed:"
            git status --porcelain
            echo "📋 DRY RUN: Tags that would be pushed:"
            git tag --list | tail -10 || echo "No tags found"
            echo "✅ DRY RUN: Would commit version bumps and push tags"
          else
            echo "🔄 Committing version bumps..."

            # Validate git identity inputs (prevent empty strings from overriding defaults)
            if [ -z "$GIT_USER_NAME" ]; then
              echo "⚠️  git-user-name is empty, using default: GitHub Action"
              GIT_USER_NAME="GitHub Action"
            fi

            if [ -z "$GIT_USER_EMAIL" ]; then
              echo "⚠️  git-user-email is empty, using default: action@github.com"
              GIT_USER_EMAIL="action@github.com"
            fi

            # Configure git for the action (using -c flag for safer parameter passing)
            export GIT_AUTHOR_NAME="$GIT_USER_NAME"
            export GIT_AUTHOR_EMAIL="$GIT_USER_EMAIL"
            export GIT_COMMITTER_NAME="$GIT_USER_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_USER_EMAIL"

            # Configure git to use the PAT for authentication
            git remote set-url origin https://x-access-token:${{ secrets.IDEE_GH_TOKEN }}@github.com/${{ github.repository }}.git

            # Add all changes
            # Note: git add . respects .gitignore, so ignored files won't be added
            # This is intentional - Wireit output files in test fixtures should remain ignored
            git add .

            if git diff --staged --quiet; then
              # Nothing to stage — check whether the bump was already committed to remote
              # (idempotent rerun: version bumper ran, committed, pushed, then a later step failed)
              git fetch origin "$BRANCH"
              REMOTE_MSG=$(git log -1 --format='%s' "origin/$BRANCH")
              if echo "$REMOTE_MSG" | grep -q "chore: bump versions for release"; then
                echo "⏭️ Version bump already committed to remote — skipping commit (idempotent rerun)"
              else
                echo "❌ Error: No staged changes and no prior bump commit found on remote. Version bumper may have failed silently."
                exit 1
              fi
            else
              # Create commit with version bump message
              git commit -m "chore: bump versions for release [skip ci]"

              # Push version bumps — retry once with rebase on non-fast-forward
              echo "Pushing version bumps to $BRANCH..."
              if ! git push origin "HEAD:$BRANCH"; then
                echo "⚠️ Push failed, attempting fetch+rebase and retry..."
                git fetch origin
                git rebase "origin/$BRANCH"
                if ! git push origin "HEAD:$BRANCH"; then
                  echo "❌ Error: Push failed after rebase. Check branch protection rules."
                  exit 1
                fi
              fi
            fi

            # Push all tags — tolerate already-existing tags (do not fail the job)
            echo "Pushing tags..."
            if ! git push origin --tags; then
              echo "⚠️ Warning: Some tags may already exist on remote. Continuing."
            fi

            echo "✅ Version bumps and tags pushed successfully"
          fi

  calculate-artifact-name:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.calc.outputs.artifact-name }}
    steps:
      - name: Calculate artifact name
        id: calc
        env:
          RUN_NUMBER: ${{ github.run_number }}
          IS_DRY_RUN: ${{ inputs.dry-run || github.event.inputs.dry-run || 'false' }}
        run: |
          BASE_NAME="vsix-packages"

          # Check if already suffixed
          if [[ "$BASE_NAME" =~ -dry-run$ ]] || [[ "$BASE_NAME" =~ -release$ ]]; then
            ARTIFACT_NAME="$BASE_NAME"
          else
            if [ "$IS_DRY_RUN" = "true" ]; then
              ARTIFACT_NAME="${BASE_NAME}-${RUN_NUMBER}-dry-run"
            else
              ARTIFACT_NAME="${BASE_NAME}-${RUN_NUMBER}-release"
            fi
          fi

          echo "artifact-name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "Artifact name: $ARTIFACT_NAME"

  package:
    needs: [bump-versions, calculate-artifact-name]
    uses: salesforcecli/github-workflows/.github/workflows/vscode-package.yml@main
    with:
      node-version: ${{ inputs.node-version }}
      branch: ${{ inputs.branch || github.ref_name }}
      artifact-name: ${{ needs.calculate-artifact-name.outputs.artifact-name }}
      dry-run: ${{ inputs.dry-run || github.event.inputs.dry-run || 'false' }}
      pre-release: ${{ inputs.pre-release || github.event.inputs.pre-release || 'false' }}
      extensions-root: ${{ inputs.extensions-root || 'packages' }}
      package-manager: ${{ inputs.package-manager }}
      package-manager-version: ${{ inputs.package-manager-version }}
      cache-dependency-path: ${{ inputs.cache-dependency-path }}
      install-command: ${{ inputs.install-command }}
      package-command: ${{ inputs.package-command }}
      prerelease-package-command: ${{ inputs.prerelease-package-command }}
      web-package-command: ${{ inputs.web-package-command }}
      web-prerelease-package-command: ${{ inputs.web-prerelease-package-command }}
      artifact-glob: ${{ inputs.artifact-glob }}

  determine-publish-matrix:
    needs: [determine-changes, calculate-artifact-name]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js and install dependencies
        uses: salesforcecli/github-workflows/.github/actions/setupNodeAndInstall@main
        with:
          node-version: ${{ inputs.node-version || '22.x' }}
          package-manager: ${{ inputs.package-manager }}
          package-manager-version: ${{ inputs.package-manager-version }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          install-command: ${{ inputs.install-command }}

      - name: Determine publish matrix
        id: matrix
        env:
          REGISTRIES: ${{ inputs.registries }}
          SELECTED_EXTENSIONS: ${{ needs.determine-changes.outputs.selected-extensions }}
          IS_NIGHTLY: ${{ inputs.nightly && 'true' || 'false' }}
          EXTENSIONS_ROOT: ${{ inputs.extensions-root || 'packages' }}
        run: |
          # Skip marketplace publishing for nightly builds
          if [ "$IS_NIGHTLY" = "true" ]; then
            echo "Nightly build detected - skipping marketplace publishing"
            echo 'matrix=[]' >> $GITHUB_OUTPUT
          else
            # Parse extensions
            IFS=',' read -ra extensions <<< "$SELECTED_EXTENSIONS"

            # Determine registries
            if [ "$REGISTRIES" = "all" ]; then
              registries=("vsce" "ovsx")
            else
              IFS=',' read -ra registries <<< "$REGISTRIES"
            fi

            # Build matrix JSON
            matrix_entries=()
            for ext in "${extensions[@]}"; do
              [ -z "$ext" ] && continue

              # Read package name from package.json to build VSIX pattern
              package_json="$EXTENSIONS_ROOT/$ext/package.json"
              if [ -f "$package_json" ]; then
                package_name=$(jq -r '.name' "$package_json")
                vsix_pattern="*${package_name}*-[0-9]*.vsix"
              else
                # Fallback to extension directory name
                vsix_pattern="*${ext}*.vsix"
              fi

              for registry in "${registries[@]}"; do
                [ -z "$registry" ] && continue

                case "$registry" in
                  vsce) marketplace="VS Code Marketplace" ;;
                  ovsx) marketplace="Open VSX Registry" ;;
                  *) marketplace="$registry" ;;
                esac

                entry=$(jq -n \
                  --arg reg "$registry" \
                  --arg pattern "$vsix_pattern" \
                  --arg market "$marketplace" \
                  '{registry: $reg, vsix_pattern: $pattern, marketplace: $market}')

                matrix_entries+=("$entry")
              done
            done

            # Combine into matrix JSON
            if [ ${#matrix_entries[@]} -eq 0 ]; then
              matrix_json='{"include":[]}'
            else
            matrix_json=$(printf '%s\n' "${matrix_entries[@]}" | jq -sc '{include: .}')
            fi

            echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
          fi

  publish-skipped-notice:
    name: Publish Skipped Notice
    needs:
      [
        determine-changes,
        bump-versions,
        package,
        calculate-artifact-name,
        determine-publish-matrix,
      ]
    runs-on: ubuntu-latest
    if: needs.determine-publish-matrix.outputs.matrix == '[]' || needs.determine-publish-matrix.outputs.matrix == ''
    steps:
      - name: Log skipped publish
        env:
          SELECTED_EXTENSIONS: ${{ needs.determine-changes.outputs.selected-extensions }}
          REGISTRIES: ${{ inputs.registries }}
        run: |
          echo "ℹ️ Marketplace publishing skipped for this build type"
          echo "  Reason: Nightly builds only create GitHub releases, not marketplace publishes"
          echo "  Extensions would be published: $SELECTED_EXTENSIONS"
          echo "  Registries configured: $REGISTRIES"

  publish:
    needs:
      [
        bump-versions,
        package,
        calculate-artifact-name,
        determine-publish-matrix,
      ]
    runs-on: ubuntu-latest
    if: needs.determine-publish-matrix.outputs.matrix != '[]' && needs.determine-publish-matrix.outputs.matrix != ''
    strategy:
      matrix: ${{ fromJson(needs.determine-publish-matrix.outputs.matrix) }}
    steps:
      - name: Audit release attempt
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
          REGISTRY: ${{ matrix.registry }}
          MARKETPLACE: ${{ matrix.marketplace }}
          DRY_RUN: ${{ inputs.dry-run || github.event.inputs.dry-run || 'false' }}
        run: |
          # Create audit log entry for release attempt
          AUDIT_LOG="/tmp/release_audit.log"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # Log audit information
          echo "[$TIMESTAMP] RELEASE_ATTEMPT: actor=$ACTOR, repo=$REPO, run_id=$RUN_ID, workflow=$WORKFLOW, branch=$BRANCH, registry=$REGISTRY, marketplace=$MARKETPLACE, dry_run=$DRY_RUN" >> "$AUDIT_LOG"

          # Also log to GitHub Actions output for visibility
          echo "🔍 AUDIT: Release attempt logged - $TIMESTAMP"
          echo "  Actor: $ACTOR"
          echo "  Repository: $REPO"
          echo "  Run ID: $RUN_ID"
          echo "  Workflow: $WORKFLOW"
          echo "  Branch: $BRANCH"
          echo "  Registry: $REGISTRY"
          echo "  Marketplace: $MARKETPLACE"
          echo "  Dry-run: $DRY_RUN"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.IDEE_GH_TOKEN || github.token }}
          ref: ${{ inputs.branch || github.ref }}

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.calculate-artifact-name.outputs.artifact-name }}
          path: ./vsix-artifacts

      - name: List downloaded artifacts
        run: |
          echo "=== DEBUG: Downloaded Artifacts ==="
          echo "Artifact name: ${{ needs.calculate-artifact-name.outputs.artifact-name }}"
          echo "Download path: ./vsix-artifacts"
          echo ""

          if [ -d "./vsix-artifacts" ]; then
            echo "Directory exists. Contents:"
            ls -la ./vsix-artifacts/
            echo ""
            
            echo "VSIX files found:"
            find ./vsix-artifacts -name "*.vsix" -exec ls -la {} \;
            echo ""
            
            echo "Total VSIX files: $(find ./vsix-artifacts -name "*.vsix" | wc -l)"
          else
            echo "❌ Directory ./vsix-artifacts does not exist!"
          fi
          echo "=== END DEBUG ==="

      - name: Find VSIX file for publishing
        id: find_vsix
        env:
          EXCLUDE_WEB: ${{ inputs.exclude-web-vsix || 'false' }}
          VSIX_PATTERN: ${{ matrix.vsix_pattern }}
        run: |
          ARTIFACTS_DIR="./vsix-artifacts"

          # Find VSIX, optionally excluding *-web-* files
          if [ "$EXCLUDE_WEB" = "true" ]; then
            VSIX_FILE=$(find "$ARTIFACTS_DIR" -type f -name "$VSIX_PATTERN" ! -name '*-web-*' | head -1)
          else
            VSIX_FILE=$(find "$ARTIFACTS_DIR" -name "$VSIX_PATTERN" | head -1)
          fi

          if [ -z "$VSIX_FILE" ]; then
            echo "❌ No VSIX file found matching pattern: $VSIX_PATTERN"
            echo "Searching in: $ARTIFACTS_DIR"
            echo "Available files:"
            find "$ARTIFACTS_DIR" -name "*.vsix" -exec ls -la {} \;
            exit 1
          fi

          echo "vsix_file=$VSIX_FILE" >> $GITHUB_OUTPUT
          echo "Found VSIX file: $VSIX_FILE"

      - name: Publish to ${{ matrix.marketplace }}
        uses: salesforcecli/github-workflows/.github/actions/vscode/publish-vsix@main
        env:
          # Pass tokens as environment variables for better security
          VSCE_PERSONAL_ACCESS_TOKEN: ${{ matrix.registry == 'vsce' && secrets.VSCE_PERSONAL_ACCESS_TOKEN || '' }}
          OVSX_PAT: ${{ matrix.registry == 'ovsx' && secrets.IDEE_OVSX_PAT || '' }}
        with:
          vsix-path: ${{ steps.find_vsix.outputs.vsix_file }}
          publish-tool: ${{ matrix.registry }}
          pre-release: ${{ inputs.pre-release || github.event.inputs.pre-release || 'false' }}
          dry-run: ${{ inputs.dry-run || github.event.inputs.dry-run || 'false' }}

      - name: Audit release result
        shell: bash
        if: inputs.dry-run != 'true' && github.event.inputs.dry-run != 'true'
        env:
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
          REGISTRY: ${{ matrix.registry }}
          MARKETPLACE: ${{ matrix.marketplace }}
        run: |
          # Log the result of the release attempt
          AUDIT_LOG="/tmp/release_audit.log"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          if [ $? -eq 0 ]; then
            echo "[$TIMESTAMP] RELEASE_SUCCESS: actor=$ACTOR, repo=$REPO, run_id=$RUN_ID, branch=$BRANCH, registry=$REGISTRY, marketplace=$MARKETPLACE" >> "$AUDIT_LOG"
            echo "✅ AUDIT: Release successful - $TIMESTAMP"
          else
            echo "[$TIMESTAMP] RELEASE_FAILURE: actor=$ACTOR, repo=$REPO, run_id=$RUN_ID, branch=$BRANCH, registry=$REGISTRY, marketplace=$MARKETPLACE" >> "$AUDIT_LOG"
            echo "❌ AUDIT: Release failed - $TIMESTAMP"
          fi

  create-github-releases:
    name: Create GitHub Releases
    needs: [determine-changes, package, calculate-artifact-name]
    runs-on: ubuntu-latest
    if: needs.package.result == 'success' && needs.determine-changes.outputs.selected-extensions != '' && github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}
          token: ${{ secrets.IDEE_GH_TOKEN || github.token }}

      - name: Setup Node.js and install dependencies
        uses: salesforcecli/github-workflows/.github/actions/setupNodeAndInstall@main
        with:
          node-version: ${{ inputs.node-version || '22.x' }}
          package-manager: ${{ inputs.package-manager }}
          package-manager-version: ${{ inputs.package-manager-version }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          install-command: ${{ inputs.install-command }}

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.calculate-artifact-name.outputs.artifact-name }}
          path: ./vsix-artifacts

      - name: Create GitHub releases
        env:
          GITHUB_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SELECTED_EXTENSIONS: ${{ needs.determine-changes.outputs.selected-extensions }}
          IS_NIGHTLY: ${{ inputs.nightly && 'true' || 'false' }}
          PRE_RELEASE: ${{ inputs.pre-release || github.event.inputs.pre-release || 'false' }}
          VERSION_BUMP: ${{ inputs.version-bump }}
          DRY_RUN: ${{ inputs.dry-run || github.event.inputs.dry-run || 'false' }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
          VSIX_ARTIFACTS_PATH: ./vsix-artifacts
          EXTENSIONS_ROOT: ${{ inputs.extensions-root || 'packages' }}
          EXCLUDE_WEB: ${{ inputs.exclude-web-vsix || 'false' }}
        run: |
          echo "Mode: $([ "$DRY_RUN" = "true" ] && echo "DRY RUN" || echo "LIVE")"
          echo "Creating GitHub releases..."

          IFS=',' read -ra extensions <<< "$SELECTED_EXTENSIONS"

          for ext in "${extensions[@]}"; do
            [ -z "$ext" ] && continue

            package_json="$EXTENSIONS_ROOT/$ext/package.json"
            if [ ! -f "$package_json" ]; then
              echo "⚠️  Skipping $ext: package.json not found"
              continue
            fi

            current_version=$(jq -r '.version' "$package_json")
            package_name=$(jq -r '.name' "$package_json")
            echo "Processing extension: $ext (package: $package_name, version: $current_version)"

            # Find VSIX files using the package name from package.json
            vsix_pattern="*${package_name}*.vsix"

            vsix_files=("$VSIX_ARTIFACTS_PATH"/$ext/$vsix_pattern)
            if [ ! -f "${vsix_files[0]}" ]; then
              echo "⚠️  No VSIX files found for $ext"
              continue
            fi

            # Optionally filter out *-web-* builds
            if [ "${EXCLUDE_WEB:-false}" = "true" ]; then
              filtered_files=()
              for file in "${vsix_files[@]}"; do
                if [[ ! "$(basename "$file")" =~ -web- ]]; then
                  filtered_files+=("$file")
                fi
              done
            else
              filtered_files=("${vsix_files[@]}")
            fi

            # Create release tag
            release_tag="v$current_version"
            release_title="$ext v$current_version"

            if [ "$IS_NIGHTLY" = "true" ]; then
              nightly_date=$(date -u +%Y%m%d)
              branch_suffix=""
              [ "$BRANCH" != "main" ] && branch_suffix=".${BRANCH//\//-}"
              release_tag="v${current_version}-nightly${branch_suffix}.${nightly_date}"
              release_title="$ext v$current_version (Nightly $BRANCH $nightly_date)"
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "✅ DRY RUN: Would create release $release_tag with ${#filtered_files[@]} VSIX files"
            else
              # Check if release exists
              if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                echo "⏭️  Release $release_tag already exists - skipping"
              else
                # Generate release notes
                notes_file=".release-notes-$(date +%s).tmp"
                cat > "$notes_file" << EOF
          ## $ext v$current_version

          ### Installation
          Download the VSIX file and install via VS Code.

          $([ "$PRE_RELEASE" = "true" ] && echo "⚠️ **This is a pre-release version**")
          $([ "$IS_NIGHTLY" = "true" ] && echo "🌙 **Nightly build from $(date -u +%Y%m%d)**")
          EOF

                # Create release
                gh release create "$release_tag" \
                  --title "$release_title" \
                  --notes-file "$notes_file" \
                  --prerelease="$PRE_RELEASE" \
                  --repo "$GITHUB_REPOSITORY" \
                  "${filtered_files[@]}"

                rm -f "$notes_file"
                echo "✅ Release created for $ext"
              fi
            fi
          done

          echo "$([ "$DRY_RUN" = "true" ] && echo "✅ DRY RUN complete" || echo "✅ Releases created")"

  publish-to-cbweb-marketplace:
    name: Publish to CBWeb Internal Marketplace
    needs: [package, create-github-releases, calculate-artifact-name]
    runs-on: ubuntu-latest
    if: needs.package.result == 'success' && inputs.publish-web-vsix
    steps:
      - name: Download VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.calculate-artifact-name.outputs.artifact-name }}
          path: ./vsix-artifacts

      - name: Find web-target VSIX for CBWeb
        id: find-web-vsix
        run: |
          VSIX_FILE=$(find ./vsix-artifacts -type f -name "*-web-*.vsix" | head -1)
          if [ -z "$VSIX_FILE" ]; then
            echo "Required web-target VSIX was not found in artifacts"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$VSIX_FILE" 2>/dev/null || stat -f%z "$VSIX_FILE" 2>/dev/null || echo "unknown")
          echo "Found web VSIX: $VSIX_FILE (${FILE_SIZE} bytes)"
          echo "vsix_file=$VSIX_FILE" >> $GITHUB_OUTPUT
          echo "has_web_vsix=true" >> $GITHUB_OUTPUT

      - name: Publish web VSIX to CBWeb internal marketplace
        if: steps.find-web-vsix.outputs.has_web_vsix == 'true' && inputs.dry-run != 'true' && github.event.inputs.dry-run != 'true'
        run: |
          if [ -z "$MARKETPLACE_URL" ] || [ -z "$MARKETPLACE_DEPLOY_TOKEN" ]; then
            echo "CBWeb marketplace credentials are required for live publishing"
            exit 1
          fi

          echo "Publishing $VSIX_FILE to CBWeb marketplace..."

          HTTP_CODE=$(curl -s -o response.json -w '%{http_code}' \
            --retry 2 --retry-delay 5 \
            -X POST "${MARKETPLACE_URL}/api/internal/publish" \
            -H "Authorization: Bearer ${MARKETPLACE_DEPLOY_TOKEN}" \
            -F "vsix=@${VSIX_FILE}")

          echo "HTTP response code: $HTTP_CODE"
          cat response.json

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Successfully published to CBWeb marketplace"
          else
            echo "Failed to publish to CBWeb marketplace (HTTP $HTTP_CODE)"
            exit 1
          fi
        env:
          VSIX_FILE: ${{ steps.find-web-vsix.outputs.vsix_file }}
          MARKETPLACE_URL: ${{ vars.MARKETPLACE_URL }}
          MARKETPLACE_DEPLOY_TOKEN: ${{ secrets.MARKETPLACE_DEPLOY_TOKEN }}

      - name: Dry-run summary
        if: steps.find-web-vsix.outputs.has_web_vsix == 'true' && (inputs.dry-run == 'true' || github.event.inputs.dry-run == 'true')
        run: |
          echo "🔄 DRY RUN: Would publish ${{ steps.find-web-vsix.outputs.vsix_file }} to CBWeb marketplace"

  slack-notify:
    name: Slack Notification
    needs:
      [
        determine-changes,
        bump-versions,
        package,
        publish,
        publish-skipped-notice,
      ]
    runs-on: ubuntu-latest
    if: always() && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Get Extension Details
        id: extension-details
        env:
          EXTENSIONS_ROOT: ${{ inputs.extensions-root || 'packages' }}
          SELECTED_EXTENSIONS: ${{ needs.determine-changes.outputs.selected-extensions }}
          VERSION_BUMP_INPUT: ${{ inputs.version-bump }}
          PRE_RELEASE_INPUT: ${{ inputs.pre-release || github.event.inputs.pre-release || 'false' }}
        run: |
          # Get selected extensions and their details
          VERSION_BUMP="$VERSION_BUMP_INPUT"
          PRE_RELEASE="$PRE_RELEASE_INPUT"

          # Initialize arrays for extension details
          EXTENSION_NAMES=""
          EXTENSION_VERSIONS=""
          EXTENSION_DISPLAY_NAMES=""

          IFS=',' read -ra EXTENSIONS <<< "$SELECTED_EXTENSIONS"
          for ext in "${EXTENSIONS[@]}"; do
            if [ -n "$ext" ] && [ -f "$EXTENSIONS_ROOT/$ext/package.json" ]; then
              # Get package details
              PACKAGE_NAME=$(node -p "require('./$EXTENSIONS_ROOT/$ext/package.json').name")
              PACKAGE_VERSION=$(node -p "require('./$EXTENSIONS_ROOT/$ext/package.json').version")
              DISPLAY_NAME=$(node -p "require('./$EXTENSIONS_ROOT/$ext/package.json').displayName || require('./$EXTENSIONS_ROOT/$ext/package.json').name")

              # Add to arrays
              if [ -z "$EXTENSION_NAMES" ]; then
                EXTENSION_NAMES="$PACKAGE_NAME"
                EXTENSION_VERSIONS="$PACKAGE_VERSION"
                EXTENSION_DISPLAY_NAMES="$DISPLAY_NAME"
              else
                EXTENSION_NAMES="$EXTENSION_NAMES, $PACKAGE_NAME"
                EXTENSION_VERSIONS="$EXTENSION_VERSIONS, $PACKAGE_VERSION"
                EXTENSION_DISPLAY_NAMES="$EXTENSION_DISPLAY_NAMES, $DISPLAY_NAME"
              fi
            fi
          done

          echo "extension_names=$EXTENSION_NAMES" >> $GITHUB_OUTPUT
          echo "extension_versions=$EXTENSION_VERSIONS" >> $GITHUB_OUTPUT
          echo "extension_display_names=$EXTENSION_DISPLAY_NAMES" >> $GITHUB_OUTPUT
          echo "version_bump=$VERSION_BUMP" >> $GITHUB_OUTPUT
          echo "pre_release=$PRE_RELEASE" >> $GITHUB_OUTPUT

      - name: Publish skipped summary
        if: needs.publish.result == 'skipped'
        run: |
          echo "ℹ️ Slack notification skipped - marketplace publishing was skipped"
          echo "  Reason: Nightly builds only create GitHub releases"
          echo "  Extensions: ${{ steps.extension-details.outputs.extension_display_names }}"
          echo "  Versions: ${{ steps.extension-details.outputs.extension_versions }}"

      - name: Dry-run Slack summary
        if: (inputs.dry-run == 'true' || github.event.inputs.dry-run == 'true') && needs.publish.result != 'skipped'
        run: |
          echo "🔄 DRY RUN: Would send Slack notification"
          echo "  Extensions: ${{ steps.extension-details.outputs.extension_display_names }}"
          echo "  Versions: ${{ steps.extension-details.outputs.extension_versions }}"
          echo "  Release Type: ${{ steps.extension-details.outputs.pre_release == 'true' && 'Pre-release' || 'Stable' }}"

      - name: Notify Slack
        if: inputs.dry-run != 'true' && github.event.inputs.dry-run != 'true' && needs.publish.result == 'success'
        uses: slackapi/slack-github-action@v3.0.3
        with:
          payload: |
            {
              "text": "${{ inputs.slack-notification-title }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ inputs.slack-notification-title }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ inputs.branch || github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Extensions:*\n${{ steps.extension-details.outputs.extension_display_names }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Versions:*\n${{ steps.extension-details.outputs.extension_versions }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Release Type:*\n${{ steps.extension-details.outputs.pre_release == 'true' && 'Pre-release' || 'Stable' }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Version Bump:*\n${{ steps.extension-details.outputs.version_bump }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Workflow Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.IDEE_MAIN_SLACK_WEBHOOK }}

  slack-notify-failure:
    name: Slack Failure Notification
    needs:
      [
        determine-changes,
        bump-versions,
        package,
        publish,
        publish-skipped-notice,
      ]
    runs-on: ubuntu-latest
    if: always() && (needs.publish.result == 'failure' || needs.bump-versions.result == 'failure' || needs.package.result == 'failure')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Get Extension Details
