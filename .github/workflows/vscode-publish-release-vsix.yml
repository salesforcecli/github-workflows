name: Publish Release VSIXs to VS Code Marketplace

on:
  workflow_call:
    inputs:
      release-tag:
        description: GitHub release tag containing the VSIX assets
        required: true
        type: string
      dry-run:
        description: Download and inspect VSIXs without publishing
        required: false
        default: false
        type: boolean
    secrets:
      VSCE_PERSONAL_ACCESS_TOKEN:
        description: VS Code Marketplace publishing token
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download release VSIXs
        id: release
        uses: salesforcecli/github-workflows/.github/actions/vscode/download-release-vsix@main
        with:
          release-tag: ${{ inputs.release-tag }}

      - name: Publish VSIXs
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          PRE_RELEASE: ${{ steps.release.outputs.pre-release }}
          VSCE_PERSONAL_ACCESS_TOKEN: ${{ secrets.VSCE_PERSONAL_ACCESS_TOKEN }}
        run: |
          # Marketplace gallery requests can sit until typed-rest-client's 180s
          # socket timeout. vsce has no timeout flag; retry per VSIX.
          # --skip-duplicate makes a retry a no-op if the first attempt committed.
          publish_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              echo "Publish attempt ${attempt}/3"
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Publish failed; retrying in 15s..."
                sleep 15
              fi
            done
            return 1
          }

          while IFS= read -r -d '' vsix; do
            args=(--packagePath "$vsix" --skip-duplicate)
            if [ "$PRE_RELEASE" = true ]; then
              args+=(--pre-release)
            fi

            if [ "$DRY_RUN" = true ]; then
              echo "Would publish $vsix to the VS Code Marketplace: @vscode/vsce publish ${args[*]}"
              continue
            fi

            if ! VSCE_PAT="$VSCE_PERSONAL_ACCESS_TOKEN" publish_with_retry npx @vscode/vsce publish "${args[@]}"; then
              echo "::error::Failed to publish $vsix after 3 attempts"
              exit 1
            fi
          done < <(find extensions -type f -name '*.vsix' -print0)
